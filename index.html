<html lang="fr" data-portable="true">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concordia</title>

<style>
/* Concordia — portail de travail du bureau et du CA de l'APEL.
   Monde visuel : lagon et case créole. Rail à gauche sur ordinateur, barre d'onglets en bas sur téléphone.
   Un seul geste fort : la Boussole de l'année sur l'accueil. Le reste reste calme et lisible. */
:root{
  --paper:#F1F6F5; --surface:#FBFDFC; --surface-2:#E3EEEC; --line:#CBDAD7; --line-2:#B3C7C3;
  --ink:#17262E; --ink-2:#465A62; --ink-3:#6E8188;
  --lagon:#0E7C7B; --lagon-2:#0A5F5E; --lagon-soft:#D3EAE8; --lagon-ink:#FFFFFF;
  --mangue:#E29424; --mangue-soft:#FBE9CF; --mangue-ink:#5A3A08;
  --letchi:#B9344F; --letchi-soft:#F6DCE2;
  --canne:#5B8A33; --canne-soft:#E1EDD3;
  --shadow:0 1px 2px rgba(23,38,46,.06), 0 8px 24px rgba(14,124,123,.08);
  --radius:14px; --radius-s:8px;
  --font-display:'Fraunces', Georgia, serif; --font-body:'Figtree', 'Segoe UI', Arial, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1C21; --surface:#152A30; --surface-2:#1C373E; --line:#2B4A52; --line-2:#3A5C65;
    --ink:#E6EFEE; --ink-2:#B4C7CA; --ink-3:#88A0A6;
    --lagon:#3DB7B3; --lagon-2:#63CFCA; --lagon-soft:#173F43; --lagon-ink:#0A1E21;
    --mangue:#F0AE4F; --mangue-soft:#3B2E16; --mangue-ink:#FBE9CF;
    --letchi:#E2697F; --letchi-soft:#3E1F27;
    --canne:#8DBB61; --canne-soft:#22361A;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1C21; --surface:#152A30; --surface-2:#1C373E; --line:#2B4A52; --line-2:#3A5C65;
  --ink:#E6EFEE; --ink-2:#B4C7CA; --ink-3:#88A0A6;
  --lagon:#3DB7B3; --lagon-2:#63CFCA; --lagon-soft:#173F43; --lagon-ink:#0A1E21;
  --mangue:#F0AE4F; --mangue-soft:#3B2E16; --mangue-ink:#FBE9CF;
  --letchi:#E2697F; --letchi-soft:#3E1F27;
  --canne:#8DBB61; --canne-soft:#22361A;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-family:var(--font-display);font-weight:600;line-height:1.15;text-wrap:balance}
h1{font-size:34px}
h2{font-size:24px}
h3{font-size:19px}
h4{font-size:16px;font-family:var(--font-body);font-weight:700}
p{margin:0}
a{color:var(--lagon-2)}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:var(--radius-s);padding:10px 12px;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--mangue);outline-offset:2px}
.sr{position:absolute;left:-9999px}

/* Structure */
.app{display:grid;grid-template-columns:252px 1fr;grid-template-rows:minmax(0,1fr);height:100%;overflow:hidden}
.rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px;gap:8px;overflow:auto}
.brand{display:flex;align-items:center;gap:12px;padding:6px 10px 18px}
.brand .mark{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--lagon),var(--lagon-2));display:grid;place-items:center;color:#fff;font-family:var(--font-display);font-weight:700;font-size:20px}
.brand h1{font-size:22px;letter-spacing:-.01em}
.brand small{display:block;color:var(--ink-3);font-size:12.5px;font-family:var(--font-body)}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--ink-2);text-decoration:none;font-weight:500}
.nav a .ic{width:22px;height:22px;flex:none;color:var(--ink-3)}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--lagon-soft);color:var(--lagon-2);font-weight:600}
.nav a[aria-current="page"] .ic{color:var(--lagon)}
.nav .count{margin-left:auto;background:var(--mangue);color:var(--mangue-ink);font-size:12px;font-weight:700;border-radius:999px;padding:1px 8px}
.nav-group{padding:14px 12px 4px;font-size:12px;font-weight:700;color:var(--ink-3)}
.rail .me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:12px;border-top:1px solid var(--line)}
.rail .me .who{font-size:13.5px;line-height:1.3}
.rail .me .who b{display:block}
.main{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%}
.topbar{display:flex;align-items:center;gap:14px;padding:14px 28px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.topbar .search{flex:1;max-width:520px;position:relative}
.topbar .search input{padding-left:40px;background:var(--paper)}
.topbar .search .ic{position:absolute;left:12px;top:11px;width:20px;height:20px;color:var(--ink-3)}
.results{position:absolute;top:46px;left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:none;max-height:380px;overflow:auto;z-index:20}
.results.open{display:block}
.results a{display:block;padding:10px 12px;border-radius:8px;text-decoration:none;color:var(--ink)}
.results a:hover{background:var(--surface-2)}
.results a small{display:block;color:var(--ink-3)}
.iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;position:relative}
.iconbtn .ic{width:22px;height:22px;color:var(--ink-2)}
.iconbtn .dot{position:absolute;top:8px;right:9px;width:9px;height:9px;border-radius:50%;background:var(--letchi);border:2px solid var(--surface)}
.content{padding:28px;overflow:auto;flex:1}
.page{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.page-head p{color:var(--ink-2);max-width:62ch;margin-top:6px}
.actions{display:flex;flex-wrap:wrap;gap:10px}

/* Boutons et puces */
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:600;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--lagon);border-color:var(--lagon);color:var(--lagon-ink)}
.btn.primary:hover{background:var(--lagon-2);border-color:var(--lagon-2)}
.btn.warm{background:var(--mangue);border-color:var(--mangue);color:var(--mangue-ink)}
.btn.small{padding:6px 11px;font-size:14px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn .ic{width:18px;height:18px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:600;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.8}
.chip.idee{background:var(--surface-2);color:var(--ink-2)}
.chip.etude{background:var(--mangue-soft);color:var(--mangue-ink)}
.chip.vote{background:var(--lagon-soft);color:var(--lagon-2)}
.chip.encours{background:var(--canne-soft);color:var(--canne)}
.chip.termine{background:var(--surface-2);color:var(--ink-3)}
.chip.attente{background:var(--mangue-soft);color:var(--mangue-ink)}
.chip.valide{background:var(--canne-soft);color:var(--canne)}
.chip.refuse{background:var(--letchi-soft);color:var(--letchi)}
.chip.info{background:var(--lagon-soft);color:var(--lagon-2)}
.chip.plain::before{display:none}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--ink-2);font-size:12.5px;font-weight:600}

/* Panneaux */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;min-width:0}
.panel.tight{padding:14px 16px}
.panel h3{margin-bottom:12px}
.panel .head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.panel .head h3{margin:0}
.panel .head a{font-size:14px;font-weight:600;text-decoration:none}
.grid{display:grid;gap:20px}
.grid > *{min-width:0}
.grid.c2{grid-template-columns:repeat(2,1fr)}
.grid.c3{grid-template-columns:repeat(3,1fr)}
.grid.c4{grid-template-columns:repeat(4,1fr)}
.grid.home{grid-template-columns:2fr 1fr}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--ink-3)}
.small{font-size:14px}
.tiny{font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--font-display);font-size:30px;font-weight:600;line-height:1.1}
.kpi span{color:var(--ink-3);font-size:13.5px}

/* Listes */
.list{display:flex;flex-direction:column}
.list > .item{display:grid;grid-template-columns:1fr auto;gap:8px 16px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.list > .item:first-child{border-top:none;padding-top:0}
.list > .item:last-child{padding-bottom:0}
.item .title{font-weight:600}
.item .meta{color:var(--ink-3);font-size:13.5px;display:flex;flex-wrap:wrap;gap:6px 14px}
.item.link{cursor:pointer}
.item.link:hover .title{color:var(--lagon-2)}
.bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--lagon);border-radius:999px}
.bar.warm i{background:var(--mangue)}
.avatars{display:flex}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:700;color:#fff;border:2px solid var(--surface);flex:none}
.avatars .av{margin-left:-8px}
.avatars .av:first-child{margin-left:0}
.av.lg{width:56px;height:56px;font-size:19px}
.av.xl{width:72px;height:72px;font-size:24px}

/* Tableaux */
table{width:100%;border-collapse:collapse;font-size:14.5px}
th,td{text-align:left;padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--ink-3);font-weight:700}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}

/* Onglets */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:none;padding:10px 14px;cursor:pointer;color:var(--ink-2);font-weight:600;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--lagon-2);border-bottom-color:var(--lagon)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:14px;color:var(--ink-2)}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* Accueil : la Boussole */
.boussole{position:relative;overflow-x:auto;padding:8px 0 4px}
.boussole .months{display:grid;grid-template-columns:repeat(12,minmax(84px,1fr));gap:6px;min-width:1010px}
.boussole .m{border-radius:10px;background:var(--surface-2);padding:10px 10px 12px;min-height:150px;display:flex;flex-direction:column;gap:6px;position:relative}
.boussole .m.now{background:var(--lagon-soft);outline:2px solid var(--lagon)}
.boussole .m.vac{background:repeating-linear-gradient(135deg,var(--surface-2) 0 8px,var(--surface) 8px 16px)}
.boussole .m b{font-size:13px;color:var(--ink-2)}
.boussole .m.now b{color:var(--lagon-2)}
.boussole .ev{font-size:12.5px;line-height:1.3;padding:5px 7px;border-radius:7px;background:var(--surface);border-left:3px solid var(--lagon);color:var(--ink)}
.boussole .ev.apel{border-left-color:var(--mangue)}
.boussole .ev.ca{border-left-color:var(--ink-3)}
.boussole .ev.vac{border-left-color:var(--line-2);color:var(--ink-3)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink-3)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:middle}
.lanternes{display:flex;gap:10px;align-items:center}
.lanternes .l{width:30px;height:38px;border-radius:12px 12px 14px 14px;background:var(--surface-2);border:2px solid var(--line-2);position:relative}
.lanternes .l.on{background:var(--mangue);border-color:var(--mangue);box-shadow:0 0 0 4px var(--mangue-soft)}
.lanternes .l.on::after{content:"";position:absolute;left:9px;top:8px;width:8px;height:12px;border-radius:50%;background:#fff;opacity:.8}

/* Accueil : salutation */
.hello{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px}
.hello h1{font-size:40px;font-weight:500}
.hello h1 em{font-style:italic;font-weight:500;color:var(--lagon-2)}
.hello .date{color:var(--ink-3)}

/* Fil Lakour */
.post{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:16px 0;border-top:1px solid var(--line)}
.post:first-child{border-top:none;padding-top:0}
.post .by{font-weight:700}
.post .when{color:var(--ink-3);font-size:13px;margin-left:8px}
.post .txt{margin:6px 0 10px;white-space:pre-line}
.post .acts{display:flex;gap:8px;flex-wrap:wrap}
.mersi{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.mersi.on{background:var(--mangue-soft);border-color:var(--mangue);color:var(--mangue-ink)}
.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.gallery .ph{aspect-ratio:4/3;border-radius:10px;background:linear-gradient(160deg,var(--lagon-soft),var(--surface-2));display:flex;align-items:flex-end;padding:8px;font-size:12.5px;color:var(--ink-2)}

/* Kanban communication */
.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kanban .col{background:var(--surface-2);border-radius:12px;padding:12px;min-height:160px}
.kanban .col h4{margin-bottom:10px;display:flex;justify-content:space-between}
.kanban .card{background:var(--surface);border-radius:10px;padding:12px;margin-bottom:10px;border:1px solid var(--line)}
.kanban .card .t{font-weight:600}
.kanban .card .m{color:var(--ink-3);font-size:13px;margin:4px 0 10px}

/* Tâches */
.task{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:none}
.task input[type=checkbox]{width:20px;height:20px;margin:3px 0 0;accent-color:var(--lagon)}
.task.done .t{text-decoration:line-through;color:var(--ink-3)}
.title.done{text-decoration:line-through;color:var(--ink-3)}
label.item input[type=checkbox]{width:18px;height:18px;margin-top:3px;accent-color:var(--lagon)}
.task .t{flex:1}
.task .d{color:var(--ink-3);font-size:13px}

/* Formulaires */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:14px}
.field .help{color:var(--ink-3);font-size:13px}
.form{display:flex;flex-direction:column;gap:14px}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* Modales et tiroirs */
.scrim{position:fixed;inset:0;background:rgba(14,28,33,.45);display:none;z-index:40;align-items:center;justify-content:center;padding:16px}
.scrim.open{display:flex}
.modal{background:var(--surface);border-radius:16px;max-width:620px;width:100%;max-height:90vh;overflow:auto;padding:24px;box-shadow:var(--shadow)}
.modal .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:380px;max-width:100%;background:var(--surface);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .2s;z-index:45;padding:20px;overflow:auto}
.drawer.open{transform:none}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-weight:600;opacity:0;transition:opacity .2s;z-index:60;pointer-events:none;max-width:92vw;text-align:center}
.toast.show{opacity:1}

/* Alertes */
.note{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:10px;background:var(--lagon-soft);color:var(--ink)}
.note.warm{background:var(--mangue-soft)}
.note.alert{background:var(--letchi-soft)}
.note .ic{width:20px;height:20px;flex:none;margin-top:2px}


/* Thèmes au choix */
:root[data-palette="ecole"]{--lagon:#1A9BA1;--lagon-2:#137A80;--lagon-soft:#D6EFF0;--mangue:#C9A227;--mangue-soft:#F6EDC6;--mangue-ink:#5A4708;--paper:#F4F7F7;--surface-2:#E2EEEF;--line:#C9DCDE}
:root[data-palette="ecole"][data-theme="dark"]{--lagon:#4FC3C8;--lagon-2:#7AD6DA;--lagon-soft:#153F42;--mangue:#E1BC4A;--mangue-soft:#3B3112;--mangue-ink:#F6EDC6}
@media (prefers-color-scheme: dark){:root[data-palette="ecole"]:not([data-theme="light"]){--lagon:#4FC3C8;--lagon-2:#7AD6DA;--lagon-soft:#153F42;--mangue:#E1BC4A;--mangue-soft:#3B3112;--mangue-ink:#F6EDC6}}
:root[data-palette="letchi"]{--lagon:#A8324A;--lagon-2:#7E2437;--lagon-soft:#F6DCE2;--mangue:#E29424;--mangue-soft:#FBE9CF;--mangue-ink:#5A3A08;--paper:#FAF4F2;--surface-2:#F0E3E3;--line:#DCC6C8}
:root[data-palette="letchi"][data-theme="dark"]{--lagon:#E2697F;--lagon-2:#F08CA0;--lagon-soft:#3E1F27;--mangue:#F0AE4F;--mangue-soft:#3B2E16;--mangue-ink:#FBE9CF}
@media (prefers-color-scheme: dark){:root[data-palette="letchi"]:not([data-theme="light"]){--lagon:#E2697F;--lagon-2:#F08CA0;--lagon-soft:#3E1F27;--mangue:#F0AE4F;--mangue-soft:#3B2E16;--mangue-ink:#FBE9CF}}
:root[data-palette="vanille"]{--lagon:#6B4F2A;--lagon-2:#4E3A1F;--lagon-soft:#EADFCB;--mangue:#C9A227;--mangue-soft:#F6EDC6;--mangue-ink:#5A4708;--paper:#F8F4EC;--surface-2:#EEE6D8;--line:#D8CDB8}
:root[data-palette="vanille"][data-theme="dark"]{--lagon:#C9A77A;--lagon-2:#DDBE93;--lagon-soft:#3A2E1E;--mangue:#E1BC4A;--mangue-soft:#3B3112;--mangue-ink:#F6EDC6}
@media (prefers-color-scheme: dark){:root[data-palette="vanille"]:not([data-theme="light"]){--lagon:#C9A77A;--lagon-2:#DDBE93;--lagon-soft:#3A2E1E;--mangue:#E1BC4A;--mangue-soft:#3B3112;--mangue-ink:#F6EDC6}}
:root[data-palette="volcan"]{--lagon:#D8572A;--lagon-2:#B0431C;--lagon-soft:#F8DDD2;--mangue:#F2A541;--mangue-soft:#FBE9CF;--mangue-ink:#5A3A08;--paper:#F3F1EE;--surface-2:#E6E2DD;--line:#CFC9C2}
:root[data-palette="volcan"][data-theme="dark"]{--lagon:#F07A4E;--lagon-2:#F79B78;--lagon-soft:#3E2219;--mangue:#F6B45B;--mangue-soft:#3B2E16;--mangue-ink:#FBE9CF;--paper:#141414;--surface:#1E1E1E;--surface-2:#2A2A2A;--line:#3A3A3A}

function route(){ const h = (location.hash || '#accueil').slice(1); return /^[A-Za-z0-9-]+$/.test(h) ? h : 'accueil'; }

/* ---------- Rendu général ---------- */
function render(){
  const r = route();
  const base = r.startsWith('projet-') ? 'projets' : r.startsWith('dossier-') ? 'subventions' : r;
  $('#rail').innerHTML = renderRail(base);
  $('#tabbar').innerHTML = TABBAR.map(id => {
    const t = id === 'plus' ? 'Plus' : NAV.find(n => n.id === id).t;
    const cur = id === base || (id === 'plus' && !TABBAR.includes(base));
    return `<a href="#${id === 'plus' ? base : id}" ${id === 'plus' ? 'data-act="plus"' : ''} ${cur ? 'aria-current="page"' : ''}>${ic(id === 'plus' ? 'more' : id)}<span>${t}</span></a>`;
  }).join('');
  const views = {accueil, messages, projets, idees, agenda, partenaires, subventions, gouvernance, tresorerie, communication, site, reseaux, familles, ecole, forum:lakour, ressources, membres, reglages, messagerie:mailView};
  let html;
  const reserve = ['gouvernance','tresorerie','subventions','partenaires','communication','site','reseaux','familles','idees'];
  if(droits().enseignant && (reserve.includes(base) || r.startsWith('dossier-'))) html = `<div class="panel"><h2>Espace réservé aux administrateurs</h2><p class="small" style="margin-top:8px">En tant que membre associée, vous avez accès à École et enseignants, à l’agenda, au forum, aux projets en lecture, aux ressources et au trombinoscope. Les finances, les votes et la communication restent aux parents administrateurs.</p><p style="margin-top:12px"><a href="#ecole" class="btn primary">Aller à École et enseignants</a></p></div>`;
  else if(r.startsWith('projet-')) html = projetDetail(r.slice(7));
  else if(r.startsWith('dossier-')) html = dossierDetail(r.slice(8));
  else html = (views[r] || accueil)();
  $('#content').innerHTML = `<div class="page">${html}</div>`;
  $('#content').scrollTop = 0;
  $('#belldot').style.display = state.notifsLues ? 'none' : '';
  document.title = 'Concordia';
}
function renderRail(cur){

  const link = id => `<a href="#${id}" ${id === cur ? 'aria-current="page"' : ''}>${ic(id)}<span>${SECTIONS[id]}</span>${badge(id)}</a>`;
  const nav = droits().enseignant
    ? `${link('accueil')}<div class="nav-group">Mon rôle · ${esc(m.role)}</div>${coeur.map(link).join('')}<div class="nav-group">Avec les parents</div>${['messages','projets','ressources','membres'].map(link).join('')}${link('reglages')}`
    : `${link('accueil')}<div class="nav-group">Mon rôle · ${esc(m.role)}</div>${coeur.map(link).join('')}<div class="nav-group">Tronc commun</div>${TRONC.filter(id => id !== 'accueil' && id !== 'reglages').map(link).join('')}<div class="nav-group">En transparence</div>${reste.map(link).join('')}${link('reglages')}`;
  return `<div class="brand"><div class="mark">C</div><div><h1>Concordia</h1><small>APEL de l’école des Flamboyants</small></div></div>

}
function badge(id){
  let n = 0;
  if(id === 'tresorerie') n = state.depenses.filter(d => d.statut === 'attente').length;
  if(id === 'gouvernance') n = state.votes.filter(v => v.ouvert && !(state.me in v.bulletins)).length;
  if(id === 'communication') n = state.publications.filter(p => p.statut === 'relecture').length;
  if(id === 'site') n = state.articles.filter(a => a.statut === 'vote' && !(state.me in a.votes)).length;
  if(id === 'reseaux') n = state.posts.filter(p => p.statut === 'validation').length + state.canaux.filter(c => c.etat !== 'OK' && c.etat !== 'Après le vote du CA').length;
  if(id === 'ecole') n = state.ecole.demandes.filter(x => x.etat === 'recue').length;
  if(id === 'familles') n = state.familles.relais.filter(r => !r.qui).length;
  return n ? `<span class="count">${n}</span>` : '';
}

      <section class="panel"><div class="head"><h3>Projets en mouvement</h3><a href="#projets">Tous les projets</a></div>
        <div class="list">${actifs.map(p => { const done = p.taches.filter(t => t.done).length, tot = p.taches.length || 1; return `
          <div class="item link" data-act="go" data-arg="projet-${p.id}"><div style="min-width:0"><div class="row between" style="gap:8px"><div class="title">${esc(p.nom)}</div>${statutChip(p.statut)}</div>
          <div class="row" style="margin-top:8px"><div class="bar" style="flex:1;max-width:260px"><i style="width:${Math.round(100*done/tot)}%"></i></div><span class="muted small num">${done}/${p.taches.length} tâches</span><span class="muted small">échéance ${dateFr(p.echeance)}</span></div></div>${avs(p.equipe)}</div>`; }).join('')}</div></section>

          <div class="row" style="gap:12px"><div class="lanternes" aria-label="${manifsFaites} manifestations de soutien utilisées sur 6">${[0,1,2,3,4,5].map(i => `<span class="l ${i < manifsFaites ? 'on' : ''}"></span>`).join('')}</div><span class="small"><b>${manifsFaites} sur 6</b> manifestations de soutien exonérées utilisées · ${manifs.length - manifsFaites} prévues</span></div>

function boussole(){
  return `<div class="boussole"><div class="months">${ANNEE_SCOLAIRE.map(({m, y}) => {
    const now = m === TODAY.getMonth() && y === TODAY.getFullYear();
    const evs = state.evenements.filter(e => e.date && new Date(e.date + 'T12:00:00').getMonth() === m && new Date(e.date + 'T12:00:00').getFullYear() === y);
    const vac = (m === 11 && y === 2026) || (m === 0 && y === 2027);
    return `<div class="m ${now ? 'now' : ''} ${vac && !evs.length ? 'vac' : ''}"><b>${MOIS_COURT[m]} ${String(y).slice(2)}</b>${evs.map(e => `<div class="ev ${e.type === 'apel' ? 'apel' : e.type === 'ca' ? 'ca' : e.type === 'vac' ? 'vac' : ''}" title="${esc(e.nom)}">${esc(e.nom.length > 34 ? e.nom.slice(0, 32) + '…' : e.nom)}</div>`).join('')}${vac && !evs.length ? '<div class="ev vac">Vacances</div>' : ''}</div>`;
  }).join('')}</div></div>`;
}

  if(tab === 'fil') body = `<div class="panel">${p.fil.map(f => { const by = member(f.by); return `<div class="post">${av(by)}<div><span class="by">${esc(by.nom.split(' ')[0])}</span><span class="when">${dateFr(f.when)}</span><p class="txt">${esc(f.txt)}</p></div></div>`; }).join('') || '<p class="muted">Pas encore d’échange sur ce projet.</p>'}

  if(tab === 'decisions') body = `<div class="panel"><div class="list">${p.decisions.map(d => `<div class="item"><div class="title">${esc(d)}</div></div>`).join('') || '<p class="muted">Aucune décision votée pour ce projet.</p>'}</div><p class="small muted" style="margin-top:12px">Les décisions viennent du registre de Gouvernance : un projet « Voté » a toujours sa référence de PV.</p></div>`;

}
function nextStatut(p){
  const next = {idee:['etude','Passer à l’étude'], etude:['vote','Soumettre au vote du CA'], vote:['encours','Démarrer'], encours:['termine','Clore et faire le bilan']}[p.statut];

/* ---------- Idées ---------- */

/* ---------- Agenda ---------- */
function agenda(){

  const avenir = evs.filter(e => !e.date || e.date >= AUJ);
  const passes = evs.filter(e => e.date && e.date < AUJ);
  const typeChip = {apel:chip('attente plain','APEL'), ecole:chip('info plain','École'), ca:chip('plain','Réunion'), vac:chip('termine plain','Vacances'), reseau:chip('vote plain','Réseau Apel')};
  const row = e => { const open = ui.agendaOpen[e.id]; return `<div class="item" style="grid-template-columns:1fr">
    <div class="row between link" data-act="agenda-open" data-arg="${e.id}" style="cursor:pointer"><div><div class="row" style="gap:10px"><b>${e.date ? dateFr(e.date, {weekday:'short', day:'numeric', month:'long'}) : 'Date à fixer'}</b>${typeChip[e.type] || ''}${e.manif ? chip('valide plain','Manifestation de soutien') : ''}</div><div class="title">${esc(e.nom)}</div><div class="meta"><span>${esc(e.lieu || '')}</span>${e.projet ? `<span>Projet : ${esc((state.projets.find(p => p.id === e.projet) || {}).nom || '')}</span>` : ''}</div></div><span class="muted">${open ? '▴' : '▾'}</span></div>
    ${open ? `<div class="stack" style="margin-top:10px"><p class="small">${esc(e.desc)}</p>
      ${e.sondage ? `<div class="note">${ic('info')}<span class="small">La date se choisit par le sondage ouvert dans Gouvernance. <a href="#gouvernance">Répondre</a></span></div>` : ''}
      ${e.creneaux ? `<div><b class="small">Créneaux de bénévolat</b><div class="list" style="margin-top:6px">${e.creneaux.map(c => { const moi = c.inscrits.includes(state.me); const plein = c.inscrits.length >= c.places; return `<div class="item"><div><div>${esc(c.t)}</div><div class="meta"><span>${c.inscrits.length}/${c.places} inscrits</span>${c.inscrits.length ? `<span>${c.inscrits.map(id => esc(member(id).nom.split(' ')[0])).join(', ')}</span>` : ''}</div></div><button class="btn small ${moi ? '' : 'primary'}" data-act="creneau" data-arg="${e.id}:${c.id}" ${!moi && plein ? 'disabled' : ''}>${moi ? 'Me désinscrire' : plein ? 'Complet' : 'Je m’inscris'}</button></div>`; }).join('')}</div></div>` : ''}
      ${e.checklist ? `<div><b class="small">À ne pas oublier</b><ul class="small" style="margin:6px 0 0;padding-left:20px">${e.checklist.map(c => `<li>${esc(c)}</li>`).join('')}</ul></div>` : ''}
      <div class="row"><button class="btn small" data-act="ics" data-arg="${e.id}">${ic('copy')} Copier pour mon calendrier (.ics)</button>${e.projet ? `<a class="btn small" href="#projet-${e.projet}">Voir le projet</a>` : ''}</div></div>` : ''}</div>`; };
  return `<div class="page-head"><div><h1>Agenda</h1><p>L’année scolaire de l’APEL : réunions, actions, vie de l’école et vacances. Les créneaux de bénévolat s’ouvrent ici, et chaque manifestation de soutien compte dans les six exonérées.</p></div>
  <div class="actions"><button class="btn" data-act="ics-all">${ic('copy')} Tout copier (.ics)</button><button class="btn primary" data-act="ev-from-project" data-arg="">${ic('plus')} Nouvel événement</button></div></div>
  <div class="panel"><div class="head"><h3>À venir</h3></div><div class="list">${avenir.map(row).join('')}</div></div>
  <div class="panel"><div class="head"><h3>Passé</h3></div><div class="list">${passes.map(row).join('')}</div></div>`;
}
function icsFor(evs){
  const dt = iso => iso.replace(/-/g, '');
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Lakaz APEL//FR', ...evs.filter(e => e.date).flatMap(e => ['BEGIN:VEVENT', `UID:${e.id}@concordia.local`, `DTSTART;VALUE=DATE:${dt(e.date)}`, `DTEND;VALUE=DATE:${dt(e.fin || e.date)}`, `SUMMARY:${e.nom}`, `LOCATION:${e.lieu || ''}`, `DESCRIPTION:${(e.desc || '').replace(/\n/g, ' ')}`, 'END:VEVENT']), 'END:VCALENDAR'].join('\r\n');
}

/* ---------- Partenaires ---------- */
function partenaires(){
  const f = ui.filtre.part || 'tous';
  const list = state.partenaires.filter(p => f === 'tous' || p.statut === f);
  const pchip = s => chip({prospect:'idee', devis:'attente', actif:'valide', dormant:'termine'}[s], PART[s]);
  return `<div class="page-head"><div><h1>Partenaires</h1><p>Fournisseurs, commerçants, institutions, réseau Apel : qui nous aide, pour quoi, et quand on les a sollicités pour la dernière fois. Les dons en nature reçoivent un reçu et entrent au registre.</p></div><div class="actions"><button class="btn primary" data-act="part-new">${ic('plus')} Nouveau partenaire</button></div></div>
  <div class="filters">${[['tous','Tous'],['prospect','Prospects'],['devis','Devis en cours'],['actif','Actifs'],['dormant','Dormants']].map(([k, t]) => `<button aria-pressed="${f === k}" data-act="filtre" data-arg="part:${k}">${t}</button>`).join('')}</div>
  <div class="panel"><div class="list">${list.map(p => { const open = ui.partOpen[p.id]; return `<div class="item" style="grid-template-columns:1fr"><div class="row between link" data-act="part-open" data-arg="${p.id}" style="cursor:pointer"><div><div class="row" style="gap:10px"><div class="title">${esc(p.nom)}</div><span class="tag">${esc(p.type)}</span>${pchip(p.statut)}</div><div class="meta"><span>Dernier contact : ${p.dernier ? dateFr(p.dernier) : 'jamais'}</span><span>Prochaine action : ${esc(p.prochain)}</span></div></div><span class="muted">${open ? '▴' : '▾'}</span></div>
    ${open ? `<div class="grid c2" style="margin-top:12px;gap:14px"><div><b class="small">Contact</b><p class="small">${esc(p.contact)}</p><b class="small">Notes</b><p class="small">${esc(p.notes || 'Aucune note.')}</p></div><div class="stack"><button class="btn small" data-act="part-contact" data-arg="${p.id}">Noter un contact aujourd’hui</button><a class="btn small" href="#ressources">Modèle de courrier de partenariat</a><button class="btn small" data-act="don" data-arg="${p.id}">Enregistrer un don en nature</button></div></div>` : ''}</div>`; }).join('')}</div></div>`;
}

/* ---------- Subventions ---------- */
function subventions(){
  const dchip = s => chip({idee:'idee', preparation:'attente', depose:'info', accorde:'valide', refuse:'refuse', verse:'valide', bilan:'termine'}[s], DSTAT[s]);
  return `<div class="page-head"><div><h1>Subventions et aides</h1><p>Les guichets qui peuvent financer l’APEL, avec leurs pièces et leur calendrier, et nos dossiers du brouillon jusqu’au bilan à rendre. La trame commune évite de ressaisir dix fois les mêmes informations.</p></div><div class="actions"><button class="btn primary" data-act="dossier-from-project" data-arg="">${ic('plus')} Nouveau dossier</button></div></div>
  <div class="panel"><div class="head"><h3>Nos dossiers</h3></div><div class="list">${state.dossiers.map(d => { const ok = d.checklist.filter(c => c.ok).length, tot = d.checklist.length; const g = GUICHETS.find(x => x.id === d.guichet); return `<div class="item link" data-act="go" data-arg="dossier-${d.id}"><div style="min-width:0"><div class="row" style="gap:10px"><div class="title">${esc(d.nom)}</div>${dchip(d.statut)}</div><div class="meta"><span>${esc(g.nom)}</span><span class="num">Demandé : ${eur(d.montant)}</span><span>Échéance ${d.echeance ? dateFr(d.echeance) : 'à vérifier'}</span></div><div class="row" style="margin-top:8px"><div class="bar warm" style="flex:1;max-width:260px"><i style="width:${Math.round(100*ok/tot)}%"></i></div><span class="muted small num">${ok}/${tot} pièces</span></div></div>${ic('arrow')}</div>`; }).join('')}</div></div>
  <h2>Les guichets</h2>
  <div class="grid c2">${GUICHETS.map(g => `<div class="panel"><h3>${esc(g.nom)}</h3><p class="small">${esc(g.quoi)}</p><div class="stack" style="gap:8px;margin-top:10px"><div class="small"><b>Quand :</b> ${esc(g.quand)}</div><div class="small"><b>Montant :</b> ${esc(g.montant)}</div><details class="small"><summary style="cursor:pointer;font-weight:600">Pièces habituelles (${g.pieces.length})</summary><ul style="margin:6px 0 0;padding-left:20px">${g.pieces.map(p => `<li>${esc(p)}</li>`).join('')}</ul></details></div><div class="row" style="margin-top:12px"><button class="btn small" data-act="dossier-new" data-arg="${g.id}">Ouvrir un dossier</button></div></div>`).join('')}</div>
  <div class="note warm">${ic('warn')}<span class="small">Les calendriers indiqués sont des repères : chaque guichet publie ses dates. Le portail les rappelle, il ne les remplace pas.</span></div>`;
}
function dossierDetail(id){
  const d = state.dossiers.find(x => x.id === id);
  if(!d) return `<div class="panel"><h2>Dossier introuvable</h2><p><a href="#subventions">Retour</a></p></div>`;
  const g = GUICHETS.find(x => x.id === d.guichet);
  const ok = d.checklist.filter(c => c.ok).length, tot = d.checklist.length;
  const steps = ['idee','preparation','depose','accorde','verse','bilan'];
  const idx = steps.indexOf(d.statut === 'refuse' ? 'accorde' : d.statut);
  const next = steps[idx + 1];
  return `<p><a href="#subventions" class="small" style="text-decoration:none">← Subventions</a></p>
  <div class="page-head"><div><h1>${esc(d.nom)}</h1><p>${esc(g.nom)} · demandé ${eur(d.montant)} · échéance ${d.echeance ? dateFr(d.echeance) : 'à vérifier'}</p></div>
  <div class="actions">${next ? `<button class="btn primary" data-act="dossier-statut" data-arg="${d.id}:${next}">${{preparation:'Commencer la préparation', depose:'Marquer comme déposé', accorde:'Accordé', verse:'Versement reçu', bilan:'Bilan rendu'}[next]}</button>` : ''}</div></div>
  <div class="row" style="gap:6px">${steps.map((s, i) => `<span class="chip ${i <= idx ? 'valide' : 'plain'}">${DSTAT[s]}</span>`).join('')}</div>
  <div class="grid c2"><div class="panel"><div class="head"><h3>Pièces du dossier</h3><span class="muted small num">${ok}/${tot}</span></div><div class="list" style="gap:0">${d.checklist.map((c, i) => `<label class="task ${c.ok ? 'done' : ''}"><input type="checkbox" ${c.ok ? 'checked' : ''} data-act="piece-toggle" data-arg="${d.id}:${i}"><span class="t">${esc(c.t)}</span></label>`).join('')}</div></div>
  <div class="stack"><div class="panel"><h3>Trame commune pré-remplie</h3><p class="small">Présentation de l’association, bureau, chiffres clés, projet, budget et plan de financement sont repris automatiquement depuis Membres, Trésorerie et le projet lié. Il reste à relire et adapter au formulaire du guichet.</p><div class="row" style="margin-top:12px"><button class="btn small" data-act="trame" data-arg="${d.id}">${ic('copy')} Copier la trame</button></div></div>
  <div class="panel"><h3>Journal</h3><div class="list">${d.journal.map(j => `<div class="item"><div><div class="small">${esc(j.txt)}</div><div class="meta">${dateFr(j.when)}</div></div></div>`).join('') || '<p class="muted small">Rien encore.</p>'}</div></div></div></div>`;
}
function trame(d){
  const g = GUICHETS.find(x => x.id === d.guichet);
  const solde = state.mouvements.reduce((s, x) => s + x.montant, 0);
  return `DEMANDE DE SUBVENTION — ${g.nom}\n\nAssociation : APEL de l’école des Flamboyants, Saint-Exemple (La Réunion)\nObjet : ${d.nom}\nMontant demandé : ${eur(d.montant)}\n\nPrésentation : association de parents d’élèves de l’enseignement libre, loi 1901, gestion désintéressée. Bureau élu le 24/10/2026 : ${state.members.filter(m => m.bureau).map(m => `${m.nom} (${m.role})`).join(', ')}.\n\nSituation financière : solde au 02/11/2026 ${eur(solde)} ; comptes 2025-2026 approuvés en AG.\n\nProjet : [description reprise du projet lié]\nBudget : [recettes / dépenses prévues]\nPlan de financement : [part APEL, part demandée, autres financeurs]\n\nPièces jointes : ${g.pieces.join(' ; ')}.`;
}

/* ---------- Gouvernance ---------- */
function gouvernance(){
  const ca = state.reunions.find(r => r.id === 'r2');
  const tab = ui.tab.gouv || 'reunions';
  const tabs = [['reunions','Réunions'],['votes','Votes'],['decisions','Registre des décisions'],['statuts','Statuts et règlement'],['documents','Documents'],['mandats','Mandats']];
  let body = '';
  if(tab === 'reunions') body = `<div class="grid c2">
    <div class="panel"><div class="head"><h3>Prochain conseil d’administration</h3>${chip('attente','Date à fixer')}</div>
      <p class="small">Le sondage de date est ouvert jusqu’au 8 novembre. L’ordre du jour est collaboratif : chaque administrateur peut ajouter un point jusqu’à la convocation.</p>
      <div class="list" style="margin-top:12px">${ca.odj.map((o, i) => `<div class="item"><div><div class="title">${i + 1}. ${esc(o.t)}</div><div class="meta"><span>Porté par ${esc(member(o.par).nom.split(' ')[0])}</span><span>${o.duree} min</span></div></div></div>`).join('')}</div>
      <p class="small muted" style="margin-top:10px">Durée prévue : ${ca.odj.reduce((s, o) => s + o.duree, 0)} min.</p>
      <form class="row" style="margin-top:12px" data-act="odj-add"><input name="t" placeholder="Ajouter un point à l’ordre du jour" aria-label="Point à ajouter" required style="flex:1;min-width:200px"><input name="duree" type="number" min="5" max="60" value="10" aria-label="Durée en minutes" style="width:90px"><button class="btn" type="submit">Ajouter</button></form>
      <div class="row" style="margin-top:14px"><button class="btn primary" data-act="seance-start">Ouvrir le mode séance</button><button class="btn" data-act="convocation">${ic('copy')} Copier la convocation</button></div></div>
    <div class="stack">${ui.seance ? seance(ca) : `<div class="panel"><h3>Le mode séance</h3><p class="small">Pendant la réunion, le portail déroule l’ordre du jour point par point, affiche le temps prévu, ouvre les votes au bon moment et prépare le procès-verbal à partir de ce qui a été décidé. La secrétaire relit, signe, dépose.</p></div>`}
    <div class="panel"><div class="head"><h3>Réunions passées</h3></div><div class="list">${state.reunions.filter(r => r.statut === 'passee').map(r => `<div class="item"><div><div class="title">${esc(r.nom)} du ${dateFr(r.date)}</div><div class="meta"><span>${r.presents} présents</span><span>${r.pv ? 'PV déposé' : 'PV à rédiger'}</span></div></div><a class="btn small" href="#gouvernance" data-act="tab" data-arg="gouv:documents">Lire le PV</a></div>`).join('')}</div></div></div></div>`;
  if(tab === 'votes') body = `<div class="grid c2">${state.votes.map(v => { const counts = v.options.map((_, i) => ((v.comptes || [])[i] || 0) + Object.values(v.bulletins).filter(b => b === i).length); const n = counts.reduce((a, b) => a + b, 0); const mien = v.bulletins[state.me]; return `<div class="panel"><div class="head"><h3 style="margin:0">${esc(v.q)}</h3>${v.ouvert ? chip('valide','Ouvert') : chip('plain','À venir')}</div>
    ${v.note ? `<p class="small muted">${esc(v.note)}</p>` : ''}
    <div class="stack" style="margin-top:10px">${v.options.map((o, i) => `<div><div class="row between small"><span>${esc(o)}${mien === i ? ' · <b>votre choix</b>' : ''}</span><span class="num muted">${counts[i]}</span></div><div class="bar" style="margin-top:4px"><i style="width:${n ? Math.round(100*counts[i]/n) : 0}%"></i></div></div>`).join('')}</div>
    <div class="row between" style="margin-top:12px;flex-wrap:wrap;gap:8px"><span class="small muted">${n} réponse(s)${v.comptes ? ' (plusieurs choix possibles)' : ' sur ' + state.members.length}${v.clos ? ` · clôture ${dateFr(v.clos)}` : ''}</span>${v.ouvert ? `<div class="row" style="gap:6px">${v.options.map((o, i) => `<button class="btn small ${mien === i ? 'primary' : ''}" data-act="vote" data-arg="${v.id}:${i}">${esc(o.length > 18 ? o.slice(0,16) + '…' : o)}</button>`).join('')}</div>` : ''}</div>
    ${v.type === 'decision' ? '<p class="tiny muted" style="margin-top:8px">Vote nominatif des administrateurs, résultat consigné au registre et au PV.</p>' : '<p class="tiny muted" style="margin-top:8px">Sondage consultatif : la présidente fixe la date à la clôture.</p>'}</div>`; }).join('')}</div>`;
  if(tab === 'decisions') body = `<div class="panel"><table><tr><th>Date</th><th>Décision</th><th>Vote</th><th>Référence</th></tr>${state.decisions.map(d => `<tr><td class="num">${dateFr(d.date)}</td><td>${esc(d.txt)}</td><td>${esc(d.vote)}</td><td>${esc(d.ref)}</td></tr>`).join('')}</table><p class="small muted" style="margin-top:12px">Le registre est en ajout seul : une décision ne se modifie pas, elle s’annule ou se remplace par une nouvelle décision datée.</p></div>`;
  if(tab === 'statuts') body = statutsView();
  if(tab === 'documents') body = `<div class="panel"><table><tr><th>Document</th><th>Catégorie</th><th>Type</th><th>Mis à jour</th><th></th></tr>${DOCUMENTS.map(d => `<tr><td><b>${esc(d.n)}</b></td><td>${esc(d.cat)}</td><td>${esc(d.t)}</td><td class="num">${dateFr(d.maj)}</td><td><button class="btn small">Ouvrir</button></td></tr>`).join('')}</table><div class="row" style="margin-top:12px"><button class="btn" data-act="doc-add">${ic('plus')} Déposer un document</button></div></div>`;
  if(tab === 'mandats') body = `<div class="panel"><table><tr><th>Membre</th><th>Fonction</th><th>Mandat</th></tr>${state.members.map(m => `<tr><td><div class="row">${av(m)}<b>${esc(m.nom)}</b></div></td><td>${esc(m.role)}</td><td>${esc(m.mandat)}</td></tr>`).join('')}</table><div class="note" style="margin-top:14px">${ic('info')}<span class="small">Poste de vérificateur aux comptes indépendant : à créer dans les statuts (proposition à l’ordre du jour du prochain CA).</span></div></div>`;
  return `<div class="page-head"><div><h1>Gouvernance</h1><p>Réunions, votes, décisions et documents officiels. Tout ce qui engage l’association passe ici et y reste lisible pour chaque administrateur.</p></div></div>
  <div class="tabs" role="tablist">${tabs.map(([k, t]) => `<button role="tab" aria-selected="${tab === k}" data-act="tab" data-arg="gouv:${k}">${t}</button>`).join('')}</div>${body}`;
}
function seance(ca){
  const s = ui.seance; const o = ca.odj[s.i];
  if(!o) return `<div class="seance"><p class="small" style="opacity:.8">Mode séance</p><div class="step">Ordre du jour épuisé</div><p>Le procès-verbal est prêt à être relu : ${s.decisions.length} décision(s) consignée(s).</p><div class="row" style="margin-top:14px"><button class="btn primary" data-act="pv-copy">${ic('copy')} Copier le PV</button><button class="btn" data-act="seance-stop">Fermer la séance</button></div></div>`;
  return `<div class="seance"><div class="row between"><p class="small" style="opacity:.8">Mode séance · point ${s.i + 1} sur ${ca.odj.length}</p><span class="small" style="opacity:.8">${o.duree} min prévues</span></div><div class="step">${esc(o.t)}</div><p class="small" style="opacity:.85">Porté par ${esc(member(o.par).nom)}.</p>
  <div class="row" style="margin-top:16px;gap:8px"><button class="btn" data-act="seance-decide" data-arg="adopte">Adopté</button><button class="btn" data-act="seance-decide" data-arg="reporte">Reporté</button><button class="btn" data-act="seance-decide" data-arg="rejete">Rejeté</button><button class="btn primary" data-act="seance-next">Point suivant</button></div>
  ${s.decisions.length ? `<p class="small" style="margin-top:14px;opacity:.85">Déjà consigné : ${s.decisions.map(d => esc(d)).join(' · ')}</p>` : ''}</div>`;
}

/* ---------- Trésorerie ---------- */
function depRow(d){
  const dr = droits();
  const peut = dr.valideDepense && !d.validations.includes(state.me) && d.statut === 'attente';
  const sc = {attente:chip('attente', `${d.validations.length}/2 validations`), valide:chip('valide','Validée, à payer'), paye:chip('termine','Payée'), refuse:chip('refuse','Refusée')}[d.statut];
  return `<div class="item"><div><div class="row" style="gap:10px"><div class="title">${esc(d.libelle)}</div>${sc}${d.justif ? '' : chip('refuse plain','Justificatif manquant')}</div><div class="meta"><span class="num"><b>${eur(d.montant)}</b></span><span>Demandé par ${esc(member(d.demandeur).nom.split(' ')[0])} le ${dateFr(d.date)}</span>${d.projet ? `<span>Projet : ${esc((state.projets.find(p => p.id === d.projet) || {}).nom || '')}</span>` : ''}${d.validations.length ? `<span>Validé par ${d.validations.map(v => esc(member(v).nom.split(' ')[0])).join(' et ')}</span>` : ''}</div></div>
  <div class="row">${peut ? `<button class="btn small primary" data-act="valider" data-arg="${d.id}">Valider (${d.validations.length + 1}/2)</button>` : d.statut === 'attente' && dr.valideDepense ? `<span class="tiny muted">Vous avez déjà validé</span>` : d.statut === 'attente' ? `<span class="tiny muted">Validation : présidente et trésorière</span>` : ''}${d.statut === 'valide' && dr.valideDepense ? `<button class="btn small" data-act="payer" data-arg="${d.id}">Marquer payée</button>` : ''}</div></div>`;
}
function tresorerie(){
  const solde = state.mouvements.reduce((s, x) => s + x.montant, 0);
  const attente = state.depenses.filter(d => d.statut === 'attente');
  const sansJustif = state.mouvements.filter(m => !m.justif).length;
  const indice = Math.round(100 * (state.mouvements.length - sansJustif) / state.mouvements.length);
  return `<div class="page-head"><div><h1>Trésorerie</h1><p>Chaque dépense est demandée, validée par deux personnes, payée, justifiée. Chaque recette a sa pièce. Le CA voit tout, en temps réel, sans demander.</p></div><div class="actions"><button class="btn" data-act="export-csv">${ic('copy')} Exporter le registre</button><button class="btn primary" data-act="depense-new" data-arg="">${ic('plus')} Demander une dépense</button></div></div>
  <div class="grid c4"><div class="panel tight kpi"><b class="num">${eur(solde)}</b><span>solde</span></div><div class="panel tight kpi"><b class="num">${attente.length}</b><span>dépense en attente</span></div><div class="panel tight kpi"><b class="num">${eur(state.depenses.filter(d => d.statut === 'valide').reduce((s, d) => s + d.montant, 0))}</b><span>validé, à payer</span></div><div class="panel tight kpi"><b class="num">${indice} %</b><span>mouvements justifiés</span></div></div>
  <div class="tabs" role="tablist">${[['depenses','Dépenses'],['budget','Budget de l’exercice'],['registre','Registre et projets']].map(([k, t]) => `<button role="tab" aria-selected="${(ui.tab.treso || 'depenses') === k}" data-act="tab" data-arg="treso:${k}">${t}</button>`).join('')}</div>

/* ---------- Communication ---------- */
function communication(){
  const dr = droits();
  const cols = PSTEPS.map(s => ({s, items: state.publications.filter(p => p.statut === s)}));
  const next = s => PSTEPS[PSTEPS.indexOf(s) + 1];
  const label = {relecture:'Envoyer en relecture', valide:'Valider', publie:'Publier'};
  const peut = (p, n) => n === 'relecture' ? true : n === 'valide' ? dr.valideCom : n === 'publie' ? (dr.publie || dr.valideCom) : false;
  return `<div class="page-head"><div><h1>Communication</h1><p>Rien ne part sans relecture : brouillon, relecture, validation par le bureau, publication par le référent. Les canaux sont connus, le calendrier aussi.</p></div><div class="actions"><button class="btn primary" data-act="pub-from-project" data-arg="">${ic('plus')} Nouvelle publication</button></div></div>
  <div class="kanban">${cols.map(c => `<div class="col"><h4>${PSTAT[c.s]}<span class="muted">${c.items.length}</span></h4>${c.items.map(p => { const n = next(p.statut); return `<div class="card"><div class="t">${esc(p.titre)}</div><div class="m">${esc(member(p.par).nom.split(' ')[0])} · ${dateFr(p.date)}${p.relecteur ? ` · relecture : ${esc(member(p.relecteur).nom.split(' ')[0])}` : ''}</div><div class="row" style="gap:6px;margin-bottom:8px">${p.canal.map(k => `<span class="tag">${esc(k)}</span>`).join('')}</div>${n ? (peut(p, n) ? `<button class="btn small ${n === 'publie' ? 'primary' : ''}" data-act="pub-next" data-arg="${p.id}">${label[n]}</button>` : `<span class="tiny muted">${n === 'valide' ? 'Validation par le bureau' : 'Publication par le référent'}</span>`) : '<span class="tiny muted">En ligne</span>'}</div>`; }).join('')}</div>`).join('')}</div>
  <div class="grid c2"><div class="panel"><h3>Les canaux</h3><div class="list">${[['Site public apel.ecole-des-flamboyants.example','Actualités, agenda, trombinoscope, préventes. Mis à jour depuis ce portail.'],['Page « Dernières infos » (QR de l’affiche)','Les trois informations du moment, toujours à jour.'],['Mail aux familles via l’école','Texte validé par la direction, envoi par le secrétariat.'],['Groupe des parents','Rappels courts ; jamais de données personnelles ni de finances.'],['Affiche devant l’école','Permanente, avec QR ; encart papier pour les grands événements.']].map(([t, d]) => `<div class="item"><div><div class="title">${esc(t)}</div><div class="meta">${esc(d)}</div></div></div>`).join('')}</div></div>
  <div class="panel"><h3>Aperçu « Dernières infos »</h3><p class="small muted">Ce que voit un parent qui scanne le QR.</p><div style="border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:10px;background:var(--paper)"><b>APEL de l’école des Flamboyants</b><ul class="small" style="margin:8px 0 0;padding-left:18px"><li><b>Nouveau conseil d’administration</b> élu le 17 octobre : treize parents, un bureau de quatre.</li><li><b>Planning de novembre</b> : réunion kermesse le 4, journée de la bienveillance le 5, CA les 6 et 14.</li><li><b>Kermesse de Noël</b> le 11 décembre : appel aux bénévoles à venir.</li></ul><p class="tiny muted" style="margin-top:10px">Mis à jour le ${dateFr('2026-11-02')} · Écrire à l’APEL</p></div></div></div>`;
}

/* ---------- Lakour ---------- */

  <div class="grid home"><div class="stack" style="gap:20px">
    <div class="panel"><form class="form" data-act="lakour-post"><div class="field"><label for="lk">Dire quelque chose au groupe</label><textarea id="lk" name="txt" rows="3" placeholder="Un merci, une question, un coup de main à demander…" required></textarea></div><div class="row between"><select name="type" aria-label="Type" style="width:auto"><option value="partage">Partage</option><option value="coupdemain">Coup de main</option><option value="mot">Mot du bureau</option></select><button class="btn primary" type="submit">Publier</button></div></form></div>

      ${p.type === 'sondage' ? `<div class="stack" style="gap:6px;margin-bottom:10px">${p.options.map((o, i) => { const n = ((p.comptes || [])[i] || 0) + Object.values(p.bulletins).filter(b => b === i).length, tot = (p.comptes || []).reduce((x, y) => x + y, 0) + Object.values(p.bulletins).length, mien = p.bulletins[state.me] === i; return `<button class="btn small ${mien ? 'primary' : ''}" data-act="lk-vote" data-arg="${p.id}:${i}" style="justify-content:space-between">${esc(o)}<span class="num">${n}/${tot}</span></button>`; }).join('')}</div>` : ''}
      <div class="acts"><button class="mersi ${moi ? 'on' : ''}" data-act="mersi" data-arg="${p.id}" aria-pressed="${moi}">${ic('heart')} Mersi ${p.mercis.length ? p.mercis.length : ''}</button>${p.type === 'coupdemain' ? `<button class="btn small" data-act="jepeux" data-arg="${p.id}">Je peux aider</button>` : ''}<button class="btn small ghost" data-act="reply" data-arg="${p.id}">Répondre</button></div></div></div>`; }).join('')}</div>
  </div>
  <div class="stack" style="gap:20px">
    <div class="panel"><h3>Coups de main demandés</h3><div class="list">${state.lakour.filter(p => p.type === 'coupdemain').map(p => `<div class="item"><div><div class="title">${esc(p.txt.slice(0, 70))}${p.txt.length > 70 ? '…' : ''}</div><div class="meta">${esc(auteur(p).nom.split(' ')[0])}${p.aides ? ` · ${p.aides.length} volontaire(s)` : ''}</div></div></div>`).join('')}</div></div>
    <div class="panel"><h3>La galerie</h3><p class="tiny muted" style="margin-bottom:10px">Lieux, objets, mains et dos : jamais de visage d’enfant.</p><div class="gallery"><div class="ph">Chantier des préaux, 1er nov.</div><div class="ph">Goûter de la fête patronale</div><div class="ph">Jeux de cour installés</div><div class="ph">Table de l’AG</div></div></div>
    <div class="panel"><h3>Qui peut aider pour…</h3><div class="row" style="gap:6px">${[...new Set(state.members.flatMap(m => m.aide))].map(a => `<span class="tag">${esc(a)}</span>`).join('')}</div><p class="tiny muted" style="margin-top:10px">Chacun indique ses talents dans sa fiche membre.</p></div>
  </div></div>`;
}

    <h3 style="margin-top:20px">Thème</h3><div class="swatches" style="margin-top:8px">${PALETTES.map(p => `<button class="swatch" aria-pressed="${(state.palette || 'lagon') === p.id}" data-act="palette" data-arg="${p.id}"><span class="dots">${p.sw.map(c => `<i style="background:${c}"></i>`).join('')}</span><b>${esc(p.nom)}</b><span>${esc(p.d)}</span></button>`).join('')}</div>

  <div class="panel"><h3>Rôles et droits</h3><div class="tablewrap"><table><tr><th>Rôle</th><th>Valide les dépenses</th><th>Valide la communication</th><th>Publie</th><th>Gère les membres</th></tr>${r.map(([k, v]) => `<tr><td><b>${esc(k)}</b></td><td>${v.valideDepense ? 'Oui' : '—'}</td><td>${v.valideCom ? 'Oui' : '—'}</td><td>${v.publie || v.valideCom ? 'Oui' : '—'}</td><td>${v.gereMembres ? 'Oui' : '—'}</td></tr>`).join('')}</table></div><p class="tiny muted" style="margin-top:10px">Tout administrateur voit tout : les droits ne limitent que les actions.</p></div></div>
  <div class="grid c2"><div class="panel"><div class="head"><h3>Journal d’audit</h3><span class="tiny muted">Journal local</span></div><div class="list">${state.audit.slice(0, 8).map(a => `<div class="item"><div><div class="small">${esc(a.txt)}</div><div class="meta"><span>${esc(a.when)}</span><span>${esc(member(a.qui).nom)}</span></div></div></div>`).join('')}</div></div>

function formDepense(projetId){

function index(){

  state.evenements.forEach(e => out.push({t:e.nom, s:'Agenda', h:'agenda'}));
  state.partenaires.forEach(p => out.push({t:p.nom, s:'Partenaire', h:'partenaires'}));
  state.dossiers.forEach(d => out.push({t:d.nom, s:'Subvention', h:'dossier-' + d.id}));
  GUICHETS.forEach(g => out.push({t:g.nom, s:'Guichet', h:'subventions'}));
  DOCUMENTS.forEach(d => out.push({t:d.n, s:'Document', h:'gouvernance'}));
  state.members.forEach(m => out.push({t:m.nom, s:m.role, h:'membres'}));

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act, arg = el.dataset.arg || '';
  if(el.tagName === 'FORM' || el.tagName === 'SELECT' || (el.tagName === 'INPUT' && el.type !== 'checkbox')) return;
  if(el.tagName === 'A' && act === 'modal-close'){ closeModal(); return; }
  if(el.tagName === 'A' && act === 'search-go'){ $('#results').classList.remove('open'); $('#q').value = ''; return; }
  if(el.tagName === 'A' && act === 'plus'){ e.preventDefault(); modal(plusSheet()); return; }
  if(el.tagName === 'A' && act === 'go'){ e.preventDefault(); }
  if(el.tagName === 'A' && act === 'tab'){ e.preventDefault(); }
  switch(act){
    case 'go': go(arg); break;
    case 'tab': { const [k, v] = arg.split(':'); ui.tab[k] = v; render(); break; }
    case 'filtre': { const [k, v] = arg.split(':'); ui.filtre[k] = v; render(); break; }

    case 'drawer-close': $('#drawer').classList.remove('open'); break;

    case 'reset': reset(); break;
    case 'new-project': modal(formProjet()); break;
    case 'new-idea': modal(formIdee()); break;
    case 'idea-vote': { const i = state.idees.find(x => x.id === arg); i.voters = i.voters || []; const k = i.voters.indexOf(state.me); if(k >= 0){ i.voters.splice(k, 1); i.votes--; } else { i.voters.push(state.me); i.votes++; } save(); render(); break; }
    case 'idea-launch': modal(formProjet(state.idees.find(x => x.id === arg))); break;
    case 'projet-statut': { const [id, s] = arg.split(':'); const p = state.projets.find(x => x.id === id); p.statut = s; if(s === 'vote') p.decisions.push('Soumis au vote du prochain CA'); log(`Projet « ${p.nom} » : statut ${STATUTS[s]}`); save(); render(); toast(`Projet ${STATUTS[s].toLowerCase()}`); break; }
    case 'task-toggle': { const [pid, tid] = arg.split(':'); const t = state.projets.find(x => x.id === pid).taches.find(x => x.id === tid); t.done = !t.done; save(); render(); break; }
    case 'equipe-add': { const p = state.projets.find(x => x.id === arg); const v = $('#addm').value; if(v && !p.equipe.includes(v)){ p.equipe.push(v); save(); render(); toast(`${member(v).nom.split(' ')[0]} rejoint l’équipe`); } break; }
    case 'depense-new': modal(formDepense(arg)); break;
    case 'valider': { const d = state.depenses.find(x => x.id === arg); if(!d.validations.includes(state.me)){ d.validations.push(state.me); if(d.validations.length >= 2) d.statut = 'valide'; log(`Validation ${d.validations.length}/2 de « ${d.libelle} »`); save(); render(); toast(d.statut === 'valide' ? 'Dépense validée par deux personnes' : 'Première validation enregistrée'); } break; }
    case 'payer': { const d = state.depenses.find(x => x.id === arg); d.statut = 'paye'; state.mouvements.unshift({date:AUJ, libelle:d.libelle, montant:-d.montant, sens:'out', justif:d.justif}); const p = state.projets.find(x => x.id === d.projet); if(p) p.budget.depensesReelles += d.montant; log(`Paiement de « ${d.libelle} »`); save(); render(); toast('Paiement enregistré au registre'); break; }
    case 'export-csv': copier(['date;libelle;montant;piece', ...state.mouvements.map(m => `${m.date};${m.libelle};${m.montant.toFixed(2)};${m.justif ? 'oui' : 'non'}`)].join('\n'), 'Registre copié (format tableur)'); break;
    case 'export-all': copier(JSON.stringify(state, null, 2), 'Export complet copié'); break;
    case 'dossier-from-project': modal(formDossier('g1', arg)); break;
    case 'dossier-new': modal(formDossier(arg, '')); break;
    case 'dossier-statut': { const [id, s] = arg.split(':'); const d = state.dossiers.find(x => x.id === id); d.statut = s; d.journal.unshift({when:AUJ, txt:`Statut : ${DSTAT[s]}`}); save(); render(); break; }

    case 'pub-from-project': modal(formPub(arg)); break;
    case 'pub-next': { const p = state.publications.find(x => x.id === arg); const n = PSTEPS[PSTEPS.indexOf(p.statut) + 1]; if(n){ p.statut = n; if(n === 'relecture') p.relecteur = state.members.find(m => m.role === 'Vice-présidente').id; log(`Publication « ${p.titre} » : ${PSTAT[n]}`); save(); render(); toast(PSTAT[n]); } break; }

    case 'odj-add': break;

    case 'seance-start': ui.seance = {i:0, decisions:[]}; render(); break;
    case 'seance-stop': ui.seance = null; render(); break;
    case 'seance-next': ui.seance.i++; render(); break;
    case 'seance-decide': { const ca = state.reunions.find(r => r.id === 'r2'); const o = ca.odj[ui.seance.i]; const lib = {adopte:'adopté', reporte:'reporté', rejete:'rejeté'}[arg]; ui.seance.decisions.push(`${o.t} : ${lib}`); if(arg === 'adopte') state.decisions.unshift({date:AUJ, txt:o.t, vote:'CA (séance en cours)', ref:'PV CA à venir'}); ui.seance.i++; save(); render(); break; }
    case 'pv-copy': copier(`PROCÈS-VERBAL — Conseil d’administration\n\n${ui.seance.decisions.map((d, i) => `${i + 1}. ${d}`).join('\n')}\n\nLa secrétaire · La présidente`, 'PV copié'); break;
    case 'vote': { const [id, i] = arg.split(':'); const v = state.votes.find(x => x.id === id); v.bulletins[state.me] = +i; save(); render(); toast('Vote enregistré'); break; }
    case 'doc-add': toast('Dépôt de fichier : disponible dans la version complète'); break;
    case 'mersi': { const p = state.lakour.find(x => x.id === arg); const k = p.mercis.indexOf(state.me); if(k >= 0) p.mercis.splice(k, 1); else p.mercis.push(state.me); save(); render(); break; }
    case 'jepeux': { const p = state.lakour.find(x => x.id === arg); p.aides = p.aides || []; if(!p.aides.includes(state.me)) p.aides.push(state.me); save(); render(); toast('Mersi ! L’auteur du message est prévenu'); break; }

    case 'fiche': ui.fiche[arg] = true; render(); break;

  }
});

  const res = tot(b.recettes) - tot(b.depenses); const p = b.precedent;
  return `${p ? `<div class="panel"><div class="head"><h3>Exercice précédent ${esc(p.exercice)}</h3><span class="tiny muted">Bilan approuvé au CA du 07/10/2026, présenté à l’AG du 31/10</span></div><div class="grid c4" style="gap:14px"><div class="kpi"><b class="num">${eur(p.recettes)}</b><span>recettes (dont ${p.familles} familles × ${p.cotisation} €)</span></div><div class="kpi"><b class="num">${eur(p.depenses)}</b><span>dépenses</span></div><div class="kpi"><b class="num" style="color:var(--letchi)">${eur(p.resultat)}</b><span>résultat : réserves entamées</span></div><div class="kpi"><b class="num">${eur(p.tresorerie)}</b><span>trésorerie au 30/09 (banque ${eur(p.banque)}, Livret A ${eur(p.livret)}, caisse ${eur(p.caisse)})</span></div></div><p class="small muted" style="margin-top:10px">Hors produits : ${esc(p.horsProduits)}.</p><div class="note alert" style="margin-top:10px">${ic('warn')}<span class="small"><b>Points en cours de régularisation :</b> ${p.regularisations.map(esc).join(' · ')}</span></div></div>` : ''}<div class="panel"><div class="head"><h3>Budget ${esc(b.exercice)}</h3>${chip('attente', b.statut)}</div>
  <div class="grid c3" style="gap:14px;margin-bottom:16px"><div class="kpi"><b class="num">${eur(tot(b.recettes))}</b><span>recettes prévues</span></div><div class="kpi"><b class="num">${eur(tot(b.depenses))}</b><span>dépenses prévues</span></div><div class="kpi"><b class="num" style="color:${res >= 0 ? 'var(--canne)' : 'var(--letchi)'}">${eur(res)}</b><span>résultat prévu</span></div></div>
  <div class="tablewrap"><table><tr><th>Recettes</th><th class="num">Prévu</th><th class="num">Réalisé</th><th>Avancement</th></tr>${b.recettes.map(ligne).join('')}<tr><td><b>Total recettes</b></td><td class="num"><b>${eur(tot(b.recettes))}</b></td><td class="num"><b>${eur(totR(b.recettes))}</b></td><td></td></tr></table></div>
  <div class="tablewrap" style="margin-top:16px"><table><tr><th>Dépenses</th><th class="num">Prévu</th><th class="num">Réalisé</th><th>Avancement</th></tr>${b.depenses.map(ligne).join('')}<tr><td><b>Total dépenses</b></td><td class="num"><b>${eur(tot(b.depenses))}</b></td><td class="num"><b>${eur(totR(b.depenses))}</b></td><td></td></tr></table></div>
  <div class="row between" style="margin-top:16px;flex-wrap:wrap;gap:10px"><p class="small muted" style="max-width:70ch">Le réalisé se remplit depuis le registre : chaque mouvement est rattaché à un poste. Le budget est voté par le CA, puis chaque écart de plus de 20 % sur un poste est signalé en séance.</p><div class="row"><button class="btn small" data-act="budget-vote">Soumettre au vote du CA</button><button class="btn small" data-act="budget-copy">${ic('copy')} Copier pour l’AG</button></div></div></div>`;
}

const ASTAT = {brouillon:'Brouillon', relecture:'En relecture', vote:'Vote du CA', pret:'Prêt à publier', programme:'Programmé', publie:'Publié'};

function site(){

  const carte = a => { const pour = Object.values(a.votes).filter(v => v === 'pour').length, contre = Object.values(a.votes).filter(v => v === 'contre').length; const mien = a.votes[state.me]; const peutPublier = dr.publie || dr.valideCom; const open = ui.fiche['a-' + a.id];
    const next = a.statut === 'brouillon' ? ['relecture','Envoyer en relecture'] : a.statut === 'relecture' ? ['vote','Ouvrir le vote du CA'] : a.statut === 'pret' ? ['programme','Programmer'] : a.statut === 'programme' ? ['publie','Publier sur le site'] : null;

      ${a.commentaires.length ? `<div><b class="small">Remarques</b>${a.commentaires.map(c => `<p class="small" style="margin-top:4px">${av(member(c.by))} ${esc(c.txt)}</p>`).join('')}</div>` : ''}

      <div class="row">${next && (next[0] !== 'publie' || peutPublier) ? `<button class="btn small ${next[0] === 'publie' ? 'primary' : ''}" data-act="art-next" data-arg="${a.id}:${next[0]}">${next[1]}</button>` : ''}${a.statut === 'publie' ? '<span class="tiny muted">En ligne sur le site public</span>' : ''}</div></div>` : ''}</div>`; };

  if(tab === 'apercu') body = `<div class="panel" style="background:var(--paper)"><div style="max-width:720px;margin:0 auto"><p class="tiny muted">apel.ecole-des-flamboyants.example</p><h2 style="font-size:30px;margin:6px 0 4px">APEL de l’école des Flamboyants</h2><p class="small muted">Les parents, ensemble, pour l’école.</p>

    <div class="panel"><h3>Prochaines dates</h3><div class="list">${state.evenements.filter(e => e.date && e.date >= AUJ && e.type !== 'vac').slice(0,3).map(e => `<div class="item"><div><div class="title small">${esc(e.nom)}</div><div class="meta">${dateFr(e.date)}</div></div></div>`).join('')}</div></div>

const CANAUX = {
  telegram:{nom:'Telegram', lien:id => 'https://t.me/' + id.replace(/^@/, '')},
  whatsapp:{nom:'WhatsApp', lien:id => 'https://wa.me/' + (INDICATIF + id.replace(/\D/g, '').replace(/^0/, ''))},
  signal:{nom:'Signal', lien:id => 'https://signal.me/#p/' + INDICATIF + id.replace(/\D/g, '').replace(/^0/, '')},
  sms:{nom:'SMS', lien:id => 'sms:' + id.replace(/\s/g, '')},
  email:{nom:'E-mail', lien:id => 'mailto:' + id}
};
function joindre(m, compact){
  const c = m.canal || {type:'email', id:m.email}; const k = CANAUX[c.type] || CANAUX.email;
  return `<a class="btn small ${compact ? 'ghost' : ''}" href="${k.lien(c.id)}" target="_blank" rel="noopener" title="${esc(c.id)}">${compact ? '' : 'Joindre sur '}${k.nom}${compact ? '' : ` · ${esc(c.id)}`}</a>`;
}

/* ---------- Actions v2 ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if(!el) return;
  const act = el.dataset.act, arg = el.dataset.arg || '';
  switch(act){
    case 'login': modal(loginModal()); break;
    case 'login-as': state.me = arg; state.connecte = true; save(); closeModal(); go('accueil'); toast(`Bonzour ${member(arg).nom.split(' ')[0]}`); break;
    case 'art-open': ui.fiche['a-' + arg] = !ui.fiche['a-' + arg]; render(); break;
    case 'art-new': modal(formArticle()); break;
    case 'art-vote': { const [id, v] = arg.split(':'); const a = state.articles.find(x => x.id === id); a.votes[state.me] = v; const pour = Object.values(a.votes).filter(x => x === 'pour').length, contre = Object.values(a.votes).filter(x => x === 'contre').length; if(pour >= SEUIL_POUR && contre === 0 && a.statut === 'vote'){ a.statut = 'pret'; log(`Article « ${a.titre} » prêt à publier (${pour} pour)`); toast('Seuil atteint : article prêt à publier'); } else toast('Vote enregistré'); save(); render(); break; }
    case 'art-next': { const [id, s] = arg.split(':'); const a = state.articles.find(x => x.id === id); a.statut = s; log(`Article « ${a.titre} » : ${ASTAT[s]}`); save(); render(); toast(ASTAT[s]); break; }
    case 'page-edit': toast(`« ${arg} » : édition dans la version complète (texte, images, relecture)`); break;
    case 'post-next': { const [id, s] = arg.split(':'); const p = state.posts.find(x => x.id === id); p.statut = s; log(`Post réseaux : ${RSTAT[s]}`); save(); render(); toast(s === 'publie' ? 'Publié (simulation : comptes non connectés)' : 'Validé et programmé'); break; }
    case 'rs-connect': toast('Connexion du compte : nécessite l’application Meta de l’APEL, validée par Meta (version complète)'); break;
    case 'budget-vote': { if(!state.votes.find(v => v.id === 'vb')){ state.votes.unshift({id:'vb', q:`Adopter le budget ${state.budget.exercice} présenté par la trésorière`, ouvert:true, clos:'2026-11-20', options:['Pour','Contre','Abstention'], bulletins:{}, type:'decision'}); state.budget.statut = 'Soumis au vote du CA'; save(); render(); toast('Vote du budget ouvert dans Gouvernance'); } else toast('Le vote est déjà ouvert'); break; }
    case 'budget-copy': { const b = state.budget; copier(`BUDGET ${b.exercice} — APEL de l’école des Flamboyants\n\nRECETTES\n${b.recettes.map(x => `${x.nom} : ${eur(x.prevu)} (réalisé ${eur(x.realise)})`).join('\n')}\n\nDÉPENSES\n${b.depenses.map(x => `${x.nom} : ${eur(x.prevu)} (réalisé ${eur(x.realise)})`).join('\n')}`, 'Budget copié'); break; }
    case 'prop-new': modal(formProp()); break;
    case 'prop-soutien': { const p = state.statuts.propositions.find(x => x.id === arg); p.soutiens = p.soutiens || []; const k = p.soutiens.indexOf(state.me); if(k >= 0) p.soutiens.splice(k, 1); else p.soutiens.push(state.me); save(); render(); break; }
    case 'oblig-toggle': { const o = state.statuts.obligations[+arg]; o.fait = !o.fait; if(o.fait) log(`Obligation faite : ${o.t}`); save(); render(); break; }
  }
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-act]'); if(!f) return;
  const d = Object.fromEntries(new FormData(f).entries()); const act = f.dataset.act, arg = f.dataset.arg || '';
  if(act === 'art-create'){ e.preventDefault(); state.articles.unshift({id:'a' + Date.now(), titre:d.titre, extrait:d.extrait, auteur:state.me, statut:'brouillon', date:d.date || '2026-11-20', votes:{}, commentaires:[]}); save(); closeModal(); ui.tab.site = 'articles'; go('site'); toast('Brouillon créé'); }
  if(act === 'art-comment'){ e.preventDefault(); const a = state.articles.find(x => x.id === arg); a.commentaires.push({by:state.me, txt:d.txt}); save(); render(); }
  if(act === 'post-create'){ e.preventDefault(); const rs = Array.from(f.querySelectorAll('input[name=reseaux]:checked')).map(x => x.value); state.posts.unshift({id:'ps' + Date.now(), texte:d.texte, reseaux:rs.length ? rs : ['facebook'], date:d.date || '2026-11-16', statut:'validation', visuel:d.visuel, visages:true, par:state.me}); log('Post réseaux envoyé en validation'); save(); render(); toast('Envoyé au bureau pour validation'); }
  if(act === 'canal-set'){ e.preventDefault(); me().canal = {type:d.type, id:d.id || me().email}; save(); render(); toast(`Canal préféré : ${CANAUX[d.type].nom}`); }
  if(act === 'prop-create'){ e.preventDefault(); state.statuts.propositions.unshift({id:'s' + Date.now(), t:d.t, par:state.me, statut:'Proposée', detail:d.detail, vote:null, soutiens:[state.me]}); save(); closeModal(); ui.tab.gouv = 'statuts'; go('gouvernance'); toast('Proposition déposée'); }
});

/* ---------- WhatsApp : pas de synchronisation en direct, un import d’export quand on veut ---------- */
const norm2 = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
function masquer(t){ return t.replace(/\+?\d{2,3}[  ]?\d{3}[  ]?\d{2}[  ]?\d{2}[  ]?\d{2}/g, '[numéro masqué]').replace(/[⁨⁩]/g, ''); }
function parseWhatsApp(txt){
  /* Deux formats d'export : Android « 02/11/2026, 21:52 - Nom: texte » et iPhone « [11/2/26, 9:52:17 PM] Nom: texte ». */
  const lignes = txt.replace(/\r/g, '').replace(/[‎‏]/g, '').split('\n'); const msgs = []; let cur = null;
  const reA = /^(\d{2})\/(\d{2})\/(\d{4}), (\d{2}):(\d{2}) - (.*)$/;
  const reI = /^\[(\d{1,2})\/(\d{1,2})\/(\d{2,4}), (\d{1,2}):(\d{2})(?::\d{2})?\s?([AP]M)?\] (.*)$/;
  const p2 = n => String(n).padStart(2, '0');
  for(const l of lignes){
    let when = null, reste = null; let m = l.match(reA);
    if(m){ const [, d, mo, y, h, mi, r] = m; when = `${y}-${mo}-${d}T${h}:${mi}`; reste = r; }
    else { m = l.match(reI); if(m){ let [, mo, d, y, h, mi, ap, r] = m; y = y.length === 2 ? '20' + y : y; h = +h; if(ap === 'PM' && h < 12) h += 12; if(ap === 'AM' && h === 12) h = 0; when = `${y}-${p2(mo)}-${p2(d)}T${p2(h)}:${mi}`; reste = r; } }
    if(when !== null){ const k = reste.indexOf(': '); const sys = k < 0 || /^[‎\-]/.test(reste) || /^\[System/.test(reste);
      let de = sys ? null : reste.slice(0, k).replace(/^[‎~\s]+/, '').trim(); if(de === 'You' || de === 'Vous') de = me().nom;
      cur = {when, de, txt: sys ? reste : reste.slice(k + 2), sys}; msgs.push(cur); }
    else if(cur) cur.txt += '\n' + l; }
  const sondages = []; for(const m of msgs){ const t = m.txt.trim();
    if(/^SONDAGE/.test(t)){ const ls = m.txt.split('\n').map(x => x.trim()).filter(Boolean); const q = ls[1] || 'Sondage'; const opts = ls.slice(2).map(x => x.match(/^OPTION\s*:\s*(.*?)\s*\((\d+) votes?\)/)).filter(Boolean).map(x => ({t:x[1], n:+x[2]})); if(opts.length) sondages.push({when:m.when, de:m.de, q, opts}); }
    else if(/^(POLL|Poll):/i.test(t)){ const ls = m.txt.split('\n'); const q = ls[0].replace(/^(POLL|Poll):\s*/i, '').trim() || 'Sondage'; const opts = ls.slice(1).map(x => x.match(/^\s*-\s*(.+?)\s*(?:\((\d+) votes?\))?\s*$/)).filter(Boolean).map(x => ({t:x[1], n:+(x[2] || 0)})); if(opts.length) sondages.push({when:m.when, de:m.de, q, opts}); } }
  const parts = [...new Set(msgs.filter(m => !m.sys && m.de).map(m => m.de))];
  const bruit = /<Médias omis>|\(fichier joint\)|Ce message a été supprimé|<image omitted>|<video omitted>|<GIF omitted>|<document omitted>|<voice message omitted>|<sticker omitted>|This message was deleted|<Média omis>/;
  return {msgs:msgs.filter(m => !m.sys && m.de && !/^(SONDAGE|POLL|Poll:)/i.test(m.txt.trim()) && !bruit.test(m.txt)), sondages, parts, total:msgs.length};
}
function membreParNom(nom){ const n = norm2(nom); return state.members.find(m => norm2(m.nom) === n || norm2(m.nom).split(' ').includes(n.split(' ')[0]) && n.split(' ').length === 1 && !/^\+/.test(nom)) || null; }
function importWhatsAppPanel(){
  const r = ui.waImport;

  <p class="small">Le groupe reste là où il est. Quand le bureau le souhaite, un membre exporte la discussion depuis le téléphone de l’APEL (Infos du groupe → Exporter la discussion, sans les médias) et la dépose ici : les messages rejoignent le Forum, les sondages rejoignent les votes, les numéros sont masqués.</p>

/* ---------- Import d’un export WhatsApp (zip ou txt), sans synchronisation en direct ---------- */
function waModal(){
  return `<div class="head"><h2>Importer une discussion WhatsApp</h2><button class="iconbtn" data-act="modal-close" aria-label="Fermer">${ic('close')}</button></div>
  <p class="small">WhatsApp reste à part : pas de synchronisation en direct. Depuis le groupe, « Exporter la discussion » (sans ou avec médias), puis déposez le fichier ici. Les messages arrivent au Forum, les sondages exportés en texte aussi ; les numéros reconnus sont masqués et les messages dédupliqués. Vérifiez le contenu avant tout partage.</p>
  <form class="form" style="margin-top:12px" data-act="wa-run"><div class="field"><label for="waf">Fichier exporté (.zip ou .txt)</label><input id="waf" name="f" type="file" accept=".zip,.txt" required></div>
  <label class="row small" style="gap:8px"><input type="checkbox" name="systeme" style="width:auto"> Importer aussi les messages système (ajouts, suppressions)</label>
  <div class="row" style="justify-content:flex-end"><button class="btn" type="button" data-act="modal-close">Annuler</button><button class="btn primary" type="submit">Analyser et importer</button></div></form>
  <div id="wa-out" class="small muted" style="margin-top:12px"></div>`;
}
function waParse(txt){
  const lines = txt.replace(/[\u200e\u200f\u202a-\u202e\u2066-\u2069]/g, '').split(/\r?\n/);
  const re = /^\[?(\d{1,2})[\/.](\d{1,2})[\/.](\d{2,4}),?\s+(\d{1,2}):(\d{2})(?::\d{2})?\]?\s*(?:-\s*)?(.*)$/;
  const msgs = []; let cur = null;
  for(const l of lines){
    const m = l.match(re);
    if(m){ if(cur) msgs.push(cur); const rest = m[6]; const k = rest.indexOf(': '); cur = {when:`${m[3].length===2?'20'+m[3]:m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}T${m[4].padStart(2,'0')}:${m[5]}`, by: k > 0 ? rest.slice(0, k) : null, txt: k > 0 ? rest.slice(k + 2) : rest, systeme: k <= 0}; }
    else if(cur) cur.txt += '\n' + l;
  }
  if(cur) msgs.push(cur);
  return msgs;
}
function waHash(str){ let h = 5381; for(let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) >>> 0; return h.toString(36); }
function waMembre(nom){
  if(!nom) return null;
  const n = nom.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/^~\s*/, '');
  if(/^\+?\d/.test(n)) return null;
  const hit = state.members.find(m => { const mn = m.nom.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); return mn === n; });
  return hit ? hit.id : null;
}
async function waImport(file, systeme){
  let txt = '';
  if(file.name.toLowerCase().endsWith('.zip')){ const z = await JSZip.loadAsync(file); const entry = Object.values(z.files).find(f => f.name.toLowerCase().endsWith('.txt')); if(!entry) throw new Error('Aucun fichier texte dans l’archive'); if(entry._data && entry._data.uncompressedSize > 10*1024*1024) throw new Error('Texte de l’archive trop volumineux : maximum 10 Mo'); txt = await entry.async('string'); }
  else txt = await file.text();
  if(txt.length > 10*1024*1024) throw new Error('Texte décompressé trop volumineux : maximum 10 Mo');
  const msgs = waParse(txt);
  if(!msgs.length) throw new Error('Aucun message reconnu. Export attendu en français, dates jour/mois/année.');
  if(msgs.length > 20000) throw new Error('Export limité à 20 000 messages');
  const deja = new Set(state.lakour.map(p => p.wa).filter(Boolean));
  let ajoutes = 0, sondages = 0, ignores = 0;
  for(const m of msgs){
    if(m.systeme && !systeme){ ignores++; continue; }
    if(/<Médias omis>|\(fichier joint\)|Ce message a été supprimé/.test(m.txt)){ ignores++; continue; }
    const txtMasque = m.txt.replace(/\+?\d{2,3}[  ]?\d{3}[  ]?\d{2}[  ]?\d{2}[  ]?\d{2}/g, '[numéro masqué]').replace(/@[⁨⁩]*(\+?\d[\d ]{6,})[⁨⁩]*/g, '@[membre]').trim();
    if(!txtMasque){ ignores++; continue; }
    const key = m.when + '|' + waHash((m.by || '') + '|' + txtMasque);
    if(deja.has(key)){ ignores++; continue; }
    const by = waMembre(m.by);
    const post = {id:'wa' + Date.now() + Math.random().toString(36).slice(2, 6), by: by || 'ext', byNom: by ? null : (m.by && !/^\+?\d/.test(m.by.replace(/^~\s*/, '')) ? m.by.replace(/^~\s*/, '') : 'Membre (numéro masqué)'), when:m.when, txt:txtMasque, mercis:[], type:'whatsapp', wa:key};
    const sm = txtMasque.match(/^SONDAGE\s*:\s*\n([^\n]+)\n([\s\S]+)/);
    if(sm){ const opts = [], comptes = []; sm[2].split('\n').forEach(o => { const om = o.match(/^OPTION\s*:\s*(.+?)\s*\((\d+)\s+votes?\)/); if(om){ opts.push(om[1]); comptes.push(+om[2]); } }); if(opts.length){ post.type = 'sondage'; post.txt = sm[1].trim(); post.options = opts; post.comptes = comptes; post.bulletins = {}; sondages++; } }
    state.lakour.push(post); deja.add(key); ajoutes++;
  }
  state.lakour.sort((a, b) => a.when < b.when ? 1 : -1);
  if(ajoutes) log(`Import WhatsApp : ${ajoutes} message(s), ${sondages} sondage(s)`);
  save();
  return {ajoutes, sondages, ignores, total:msgs.length};
}

accueil=function(){
