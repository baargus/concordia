function forumHeader(archive=false){return `<div class="page-head"><div><div class="section-kicker">${ic('forum')} Notre espace commun</div><h1>${archive?'Le fil du groupe':'Les échanges font le lien.'}</h1><p>Une question, une idée, un coup de main. La vie de l’APEL se partage ici.</p></div><div class="actions"><button class="btn" data-act="wa-import">${ic('download')} Importer</button><button class="btn primary" data-v4="compose">${ic('plus')} Nouvelle discussion</button></div></div><div class="forum-view-bar"><a href="#forum" class="${archive?'':'active'}">Discussions</a><a href="#messages" class="${archive?'active':''}">Fil du groupe</a><a href="#reseaux">Réseaux & connexions</a></div>`;}
function topicCard(p){
  const by=auteur(p),cat=topicCategory(p),saved=state.v4.bookmarks.includes(p.id),isOpen=UI4.replies.has(p.id),replies=p.replies||[];
  return `<article class="topic" id="topic-${esc(p.id)}"><div class="topic-head">${av(by)}<div class="topic-person"><b>${esc(by.nom)}</b><small>${dateFr(p.when.slice(0,10))}${p.type==='whatsapp'?' · Import WhatsApp':' · Concordia'}</small></div><button class="iconbtn ${saved?'saved':''}" data-v4="bookmark" data-id="${p.id}" aria-label="${saved?'Retirer des favoris':'Ajouter aux favoris'}" aria-pressed="${saved}">${ic('bookmark')}</button></div>${p.title?`<h3>${esc(p.title)}</h3>`:''}<div class="topic-type">${chip((categoryClass[cat]||'info')+' plain',categoryLabel[cat])}${p.byNom?'<span class="tag">Message importé</span>':''}</div><p class="topic-text" style="margin-top:14px">${esc(p.txt)}</p>${p.type==='sondage'&&p.options?`<div class="stack" style="gap:8px;margin-top:16px">${p.options.map((o,i)=>{const n=((p.comptes||[])[i]||0)+Object.values(p.bulletins||{}).filter(v=>v===i).length;return `<button class="btn small ${p.bulletins?.[state.me]===i?'primary':''}" data-act="lk-vote" data-arg="${p.id}:${i}" style="justify-content:space-between;text-align:left">${esc(o)} <span>${n}</span></button>`;}).join('')}</div>`:''}
  <div class="topic-footer"><button class="mersi ${p.mercis.includes(state.me)?'on':''}" data-act="mersi" data-arg="${p.id}" aria-pressed="${p.mercis.includes(state.me)}">${ic('heart')} Merci${p.mercis.length?' · '+p.mercis.length:''}</button><button class="btn ghost small" data-v4="replies" data-id="${p.id}" aria-expanded="${isOpen}">${ic('forum')} ${replies.length?replies.length+' réponse'+(replies.length>1?'s':''):'Répondre'}</button>${p.type==='coupdemain'?`<button class="btn ghost small" data-v4="volunteer" data-id="${p.id}">${(p.aides||[]).includes(state.me)?'✓ Inscrit·e':'Je peux aider'}</button>`:''}<span class="spacer"></span><button class="btn ghost small" data-v4="share" data-id="${p.id}" aria-label="Partager cette discussion">${ic('reseaux')} Partager</button></div>
  ${isOpen?`<div class="reply-list">${replies.map(r=>`<div class="reply-item">${av(member(r.by))}<div><b>${esc(member(r.by).nom.split(' ')[0])}</b><p>${esc(r.txt)}</p></div></div>`).join('')}<form class="reply-form" data-v4-form="reply" data-id="${p.id}"><textarea name="text" rows="2" maxlength="4000" required aria-label="Votre réponse" placeholder="Écrire une réponse…"></textarea><button class="btn primary" type="submit">Répondre ${ic('send')}</button></form></div>`:''}</article>`;
}
lakour=function(){
  const list=[...state.lakour].sort((a,b)=>b.when.localeCompare(a.when)).filter(p=>(UI4.filter==='all'||UI4.filter==='saved'&&state.v4.bookmarks.includes(p.id)||topicCategory(p)===UI4.filter)&&(!UI4.query||norm((p.title||'')+' '+p.txt+' '+auteur(p).nom).includes(norm(UI4.query))));
  return `${forumHeader()}<div class="forum-tabs">${['all','bureau','aide','sondages','saved'].map(k=>`<button class="filter-btn" data-v4="filter" data-id="${k}" aria-pressed="${UI4.filter===k}">${k==='saved'?'☆ ':''}${categoryLabel[k]}</button>`).join('')}</div><div class="forum-layout"><div><div class="panel" style="margin-bottom:17px"><div class="forum-composer">${av(me())}<button class="compose-prompt" data-v4="compose">Qu’aimeriez-vous partager, ${esc(me().nom.split(' ')[0])} ?</button><button class="iconbtn" data-v4="compose" aria-label="Nouvelle discussion">${ic('plus')}</button></div></div><form class="forum-search" data-v4-form="search"><input type="search" name="q" value="${esc(UI4.query)}" aria-label="Rechercher dans les échanges" placeholder="Rechercher dans les échanges…"><button type="submit" class="iconbtn" aria-label="Lancer la recherche">${ic('search')}</button></form>${list.length?list.map(topicCard).join(''):`<div class="panel empty-state">${ic('forum')}<h3>${UI4.filter==='saved'?'Gardez vos échanges utiles.':'La conversation commence ici.'}</h3><p>${UI4.query?'Aucun échange ne correspond à votre recherche.':UI4.filter==='saved'?'Touchez le signet d’une discussion pour la retrouver ici.':'Aucun échange dans cette catégorie pour le moment.'}</p><button class="btn" data-v4="filter" data-id="all">Voir tous les échanges</button></div>`}</div>
  <aside class="forum-side"><section class="panel"><h3>Nos espaces</h3>${[['all','forum','Tous les échanges'],['bureau','communication','Les infos du bureau'],['aide','heart','Les coups de main'],['archives','download','Les imports WhatsApp']].map(([id,icon,t])=>`<button class="btn ghost" style="width:100%;justify-content:flex-start;margin-top:7px;font-size:11px" data-v4="filter" data-id="${id}">${ic(icon)} ${t}</button>`).join('')}</section><section class="panel"><h3>Et sur vos réseaux ?</h3><p class="tiny muted" style="margin:10px 0">Retrouvez les canaux de l’association et préparez vos connexions.</p>${NETWORKS.slice(0,3).map(n=>`<div class="channel-item"><span class="network-dot" style="color:${n.color}">${n.short}</span><div><b>${n.name}</b><small>${state.v4.links[n.id]?'Lien enregistré':'À configurer'}</small></div></div>`).join('')}<a class="btn small" href="#reseaux" style="width:100%">Gérer mes connexions ${ic('arrow')}</a></section><section class="panel warm-panel"><h3>Un forum qui fait du bien.</h3><p>Des échanges bienveillants, des idées constructives et la vie privée de chaque famille respectée.</p><button class="btn small" data-v4="charter">Notre charte d’échange</button></section></aside></div>`;
};

function validNetworkLink(n,value){
  const v=value.trim();if(n.id==='email'){if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)||/[<>\r\n]/.test(v))throw Error('Saisissez une adresse e-mail valide.');return 'mailto:'+v;}
  if(n.id==='sms'){const tel=v.replace(/[\s().-]/g,'');if(!/^\+[1-9]\d{7,14}$/.test(tel))throw Error('Utilisez le format international, par exemple +262692000000.');return 'sms:'+tel;}
  let u;try{u=new URL(v);}catch{throw Error('Saisissez un lien HTTPS complet.');}if(u.protocol!=='https:'||u.username||u.password)throw Error('Utilisez un lien HTTPS sans identifiants.');if(n.hosts&&!n.hosts.includes(u.hostname))throw Error('Le lien doit appartenir à '+n.hosts.join(' ou ')+'.');return u.href;
}

/* Fix all-day exports: DTEND is exclusive, text must be escaped and lines folded. */
icsFor=function(evs){const escI=s=>String(s||'').replace(/\\/g,'\\\\').replace(/\r?\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');const dt=s=>s.replaceAll('-','');const next=s=>{const d=new Date(s+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+1);return d.toISOString().slice(0,10);};const fold=line=>{const out=[];let buf='',bytes=0;for(const c of line){const n=new TextEncoder().encode(c).length;if(bytes+n>73){out.push(buf);buf=' ';bytes=1;}buf+=c;bytes+=n;}out.push(buf);return out.join('\r\n');};return ['BEGIN:VCALENDAR','VERSION:2.0','CALSCALE:GREGORIAN','PRODID:-//Concordia//APEL//FR',...evs.filter(e=>e?.date).flatMap(e=>['BEGIN:VEVENT','UID:'+e.id+'@concordia.apel','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+Z/,'Z'),'DTSTART;VALUE=DATE:'+dt(e.date),'DTEND;VALUE=DATE:'+dt(next(e.fin||e.date)),'SUMMARY:'+escI(e.nom),'LOCATION:'+escI(e.lieu),'DESCRIPTION:'+escI(e.desc),'END:VEVENT']),'END:VCALENDAR'].map(fold).join('\r\n');};

};

function aboutModal(){return `<div class="head"><h2>Concordia, version de travail</h2><button class="iconbtn" data-act="modal-close" aria-label="Fermer">${ic('close')}</button></div><p class="small">Une interface interactive construite à partir de votre fichier, avec ses membres, projets et éléments de travail.</p><div class="connection-flow"><div><span>DISPONIBLE ICI</span><h4>Explorer et essayer</h4><p>Navigation mobile, forum, réponses, sondages, favoris, projets, agenda, export, liens des réseaux et brouillons.</p></div><div><span>PROCHAINE ÉTAPE</span><h4>Connecter l’équipe</h4><p>Authentification réelle, droits côté serveur, données partagées, fichiers, notifications et passerelles réseau.</p></div></div><p class="prototype-note">Les modifications restent sur cet appareil. Aucun compte réseau n’est connecté ; aucun message ni paiement n’est envoyé par cette maquette. Les rôles et validations sont des simulations locales.</p><p class="prototype-note"><b>Propriété et licence.</b> Concordia (le logiciel, sans les données) est conçu et développé par Baptiste Sobocinski — DevPro Services &amp; Projects, qui en conserve le droit d’auteur. Il est publié sous <b>licence AGPL-3.0</b> : toute association peut l’utiliser, le modifier et le redistribuer librement, en conservant la mention d’auteur et sans garantie. Le nom « Concordia » n’est pas couvert par la licence. Les données saisies (membres, projets, documents, échanges) appartiennent à l’APEL et restent exportables à tout moment.</p><button class="btn" data-v4="export">${ic('download')} Exporter mon travail</button>`;}
function architectureModal(){return `<div class="head"><h2>Un point de rencontre, plusieurs connexions.</h2><button class="iconbtn" data-act="modal-close" aria-label="Fermer">${ic('close')}</button></div><p class="small">La proposition : Concordia reste le lieu de référence pour les projets et les décisions. Chaque membre retrouve les services qu’il utilise déjà.</p><div class="connection-flow"><div><span>01 · LE PORTAIL</span><h4>Concordia</h4><p>Forum structuré, projets, agenda, rôles et documents. Une application web installable, avec des données partagées côté serveur.</p></div><div><span>02 · DÉMARRER LE FORUM</span><h4>Discourse auto-hébergé</h4><p>La voie proposée pour ouvrir rapidement un forum et un chat éprouvés, reliés à Concordia. Les identités peuvent être fédérées par OIDC.</p></div><div><span>03 · LES PASSERELLES</span><h4>Selon les usages réels</h4><p>Telegram, API de publication et, si nécessaire, Matrix avec ses passerelles. Chaque réseau conserve ses contraintes ; les échecs sont suivis.</p></div></div><p class="prototype-note">Un lien enregistré ouvre un service. Une connexion de compte autorise un accès. Une synchronisation nécessite en plus un serveur et des règles de routage. Ce sont trois fonctions distinctes.</p><details><summary>Les points techniques à prévoir</summary><p>OIDC, droits vérifiés côté serveur, PostgreSQL, stockage privé des documents, file d’envoi transactionnelle, déduplication, prévention des boucles et journal d’audit. Les secrets restent sur le serveur. Une passerelle qui traite des messages chiffrés devient un point de confiance : le chiffrement ne se prolonge pas automatiquement de bout en bout entre réseaux.</p></details><a class="text-link" href="https://matrix.org/ecosystem/bridges/" target="_blank" rel="noopener noreferrer">Passerelles de l’écosystème Matrix ↗</a>`;}

 if(['lier','rs-connect','post-next','ics','ics-all','export-all','jepeux','reset'].includes(a)){

    'Accéder au webmail':'Al si lo webmail','Adresse du webmail':'Ladrès lo webmail','Enregistrer l’accès':'Anrézistr lo lyen',
    'Concordia dans votre poche':'Concordia dann zot pos','Une interface pensée pour le téléphone, la tablette et l’ordinateur.':'In lespas pou téléfon, tablèt é lordinatèr.',
    'Installer l’application':'Instal laplikasyon','Installer sur mobile':'Instal si téléfon','Exporter les données locales':'Gard in kopi bann doné isi','Exporter les données':'Gard in kopi bann doné',

    'Langue de l’interface':'Lang pou bann bouton é rubrik','Français':'Français','Créole réunionnais':'Kréol rényoné','Bêta':'Bêta',
    'Traduction des menus et des principales actions en cours de relecture. Les messages et documents gardent leur langue d’origine.':'Bann meni é bann aksyon lé tradwi ; nou ankor i rëli azot. Bann mésaz é dokiman i gard zot lang dorijin.',
    'Votre ambiance':'Zot bann kouler','Clair':'Klèr','Sombre':'Som','Océan':'Loséan','Lagon':'Lagon','Volcan':'Volkan','Contraste renforcé':'Kontras for',
    'Doux et lumineux':'Dous é klèr','Pour les soirées tranquilles':'Pou bann swaré trankil','Bleu profond, esprit du large':'Blé fon, kouler la mèr','Turquoise et sable clair':'Tirkwa é sab klèr',
    'Terracotta et pierre chaude':'Kouler la tèr é ros so','Des repères bien visibles':'Bann repèr fasil pou war','Ces choix restent enregistrés sur cet appareil.':'Zot swa i rèst anrézistré si sa laparéy-la.',
    'Choisir la langue':'Swazi la lang','Choisir le thème':'Swazi bann kouler','Terminé':'Fini','Langue enregistrée.':'La lang lé anrézistré.','Thème enregistré.':'Bann kouler lé anrézistré.',
    'Concordia sur votre PC':'Concordia si zot lordinatèr','Ouvrir le fichier sur mon PC':'Ouv lo fisyé si mon lordinatèr','Télécharger Concordia.html':'Télésarj Concordia.html',
    'Mode local : ce fichier fonctionne sur votre appareil. Les essais ne sont pas partagés avec les autres membres.':'Mod lokal : sa fisyé-la i mars si zot laparéy. Bann ésé i rèst isi, bann lezot manm i war pa.',
    'Choisir un profil de démonstration':'Swazi in profil pou éséyé','Mon canal préféré':'Mon rézo préféré','Enregistrer le brouillon':'Anrézistr lo bouyon','Mes brouillons':'Mon bann bouyon',
    'Le fil du groupe APEL':'Lo fil lo group APEL','Historique local':'Listwar gardé isi','Ajouter au fil local':'Azout dann lo fil lokal','Un message pour le groupe…':'In mésaz pou lo group…','Aucun envoi vers les réseaux':'Nana poin anvwa si bann rézo',
    'Voir le portail comme…':'War lo portail konm…','Rôles et droits':'Bann rol é bann drwa','Journal d’audit':'Rézis bann aksyon','Journal local':'Rézis lokal','Les données restent à l’APEL':'Bann doné i rèst l’APEL',
    'Exporter':'Gard in kopi','Export complet (JSON)':'Kopi tout bann doné (JSON)','Remettre le prototype à zéro':'Remèt la maquette a zéro'
  };
  const prefs = () => { state.v4 ||= {}; return state.v4.preferences ||= {}; };
  const language = () => prefs().language === 'rcf' ? 'rcf' : 'fr';
  const t = s => language() === 'rcf' ? (KR[s] || s) : s;
  const portable = () => document.documentElement.dataset.portable === 'true' || location.protocol === 'file:';
  const currentTheme = () => THEMES.find(x=>x.id===prefs().appearance) || THEMES.find(x=>x.id===(state.theme==='dark'?'sombre':['volcan','contraste'].includes(state.palette)?state.palette:'clair'));

  applyTheme = function() {
    const theme = currentTheme(), root = document.documentElement;
    state.theme = theme.mode;
    root.dataset.theme = theme.mode;root.dataset.look = theme.id;root.removeAttribute('data-palette');
    root.style.colorScheme = theme.mode;
    document.querySelector('meta[name="theme-color"]')?.setAttribute('content',theme.colors[1]);
  };
  const languageOptions = () => `<div class="language-choices" role="group" aria-label="Langue de l’interface"><button type="button" class="language-choice" data-pref="language" data-value="fr" aria-pressed="${language()==='fr'}"><span lang="fr" data-no-i18n>Français</span><small data-no-i18n>FR</small></button><button type="button" class="language-choice" data-pref="language" data-value="rcf" aria-pressed="${language()==='rcf'}"><span lang="rcf" data-no-i18n>Kréol rényoné <small>· bêta</small></span><small data-no-i18n>KR</small></button></div>`;
  const themeOptions = () => `<div class="theme-choices" role="group" aria-label="Votre ambiance">${THEMES.map(x=>`<button type="button" class="theme-choice" data-pref="theme" data-value="${x.id}" aria-pressed="${currentTheme().id===x.id}"><span class="theme-preview" style="--preview-bg:${x.colors[0]};--preview-main:${x.colors[1]};--preview-accent:${x.colors[2]}" aria-hidden="true"><i></i><i></i><i></i><span>✓</span></span><b>${x.name}</b><small>${x.detail}</small></button>`).join('')}</div>`;
  function preferencePanel() { return `<section class="panel preferences-panel"><div class="section-kicker">Langue & apparence</div><h2>À votre image.</h2><p class="small muted">Choisissez votre langue et les couleurs qui vous ressemblent.</p><h3>Langue de l’interface</h3>${languageOptions()}<p class="small muted locale-note">Traduction des menus et des principales actions en cours de relecture. Les messages et documents gardent leur langue d’origine.</p><h3>Votre ambiance</h3>${themeOptions()}<p class="tiny muted preference-footnote">Ces choix restent enregistrés sur cet appareil.</p></section>`; }
  function preferenceModal(kind) { return `<div class="head"><h2>${kind==='language'?'Choisir la langue':'Choisir le thème'}</h2><button class="iconbtn" data-act="modal-close" aria-label="Fermer">${ic('close')}</button></div>${kind==='language'?languageOptions()+'<p class="small muted locale-note">Traduction des menus et des principales actions en cours de relecture. Les messages et documents gardent leur langue d’origine.</p>':themeOptions()}<div class="preference-modal-footer"><span class="tiny muted">Ces choix restent enregistrés sur cet appareil.</span><button class="btn primary" data-act="modal-close">Terminé</button></div>`; }
  function localPanel() { return `<section class="panel local-panel"><div class="head"><h3>Concordia sur votre PC</h3>${ic('download')}</div><p class="small">${portable()?'Mode local : ce fichier fonctionne sur votre appareil. Les essais ne sont pas partagés avec les autres membres.':'Le lien web ouvre le site. Pour une copie locale, téléchargez le fichier HTML, puis ouvrez-le dans votre navigateur.'}</p><div class="row" style="margin-top:16px">${portable()?'':`<a class="btn primary" href="./Concordia.html" download="Concordia.html">${ic('download')} Télécharger Concordia.html</a>`}<button class="btn" data-pref="local-help">Ouvrir le fichier sur mon PC</button></div></section>`; }
  function localHelp() { return `<div class="head"><h2>Concordia sur votre PC</h2><button class="iconbtn" data-act="modal-close" aria-label="Fermer">${ic('close')}</button></div><ol class="local-steps"><li><b>Téléchargez le fichier Concordia.html.</b> Le lien du site en ligne ne télécharge pas le fichier.</li><li><b>Ouvrez votre dossier Téléchargements.</b> Le nom doit se terminer par <code>.html</code>, pas par <code>.txt</code>.</li><li><b>Faites un clic droit → Ouvrir avec → Chrome, Edge ou Firefox.</b> Aucun logiciel ni serveur à installer pour essayer l’interface.</li></ol><p class="prototype-note">Le fichier est autonome. Vos essais restent dans ce navigateur et sur cet appareil. Exportez vos données avant de changer de navigateur, de déplacer le fichier ou d’effacer l’historique. Le forum partagé, les courriels et les connexions aux réseaux nécessitent la future version serveur.</p>${portable()?'':`<a class="btn primary" href="./Concordia.html" download="Concordia.html">${ic('download')} Télécharger Concordia.html</a>`}`; }
  const settingsBeforePreferences = reglages;
  reglages = () => preferencePanel() + localPanel() + settingsBeforePreferences();
  // The former palette controls are replaced by the six complete themes above.
  function removeLegacyThemeControls() {
    document.querySelectorAll('.swatches').forEach(el=>{if(el.previousElementSibling?.textContent==='Thème')el.previousElementSibling.remove();if(el.nextElementSibling?.querySelector('[data-act="mode"]'))el.nextElementSibling.remove();el.remove();});
  }

  // Exact UI phrases only. User-authored text, records and input values are excluded.
  const originals = new WeakMap(), attributes = new WeakMap();
  const protectedSelector = 'script,style,textarea,code,pre,[data-no-i18n],[contenteditable],[data-act="lk-vote"],.topic-text,.topic>h3,.reply-item p,.reply-item b,.feed-mini p,.post .txt,.post .by,.item .title,.who,.topic-person,.mini-meta b,.av,.agenda-mini strong,.featured-project h4,.slim-project b';
  const normalize = s => s.trim().replace(/\s+/g,' ');
  const translate = s => {
    if(language()==='fr')return s;
    const key=normalize(s);let value=KR[key];
    if(!value && /^Qu’aimeriez-vous partager, .+ \?$/.test(key))value=key.replace('Qu’aimeriez-vous partager, ','Kosa zot i vé partazé, ');
    if(!value && /^\d+ réponses?$/.test(key))value=key.replace(/réponses?/, 'répons');
    if(!value && /^Merci(?: · \d+)?$/.test(key))value=key.replace('Merci','Mersi');
    return value ? s.replace(s.trim(),value) : s;
  };
  let observer;
  function translateUI() {
    observer?.disconnect();
    document.documentElement.lang=language();
    if(portable())document.querySelectorAll('[data-v4="install"]').forEach(el=>{delete el.dataset.v4;el.dataset.pref='local-help';el.innerHTML=ic('phone')+' Ouvrir le fichier sur mon PC';});
    const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement?.closest(protectedSelector)?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
    let node;
    while((node=walker.nextNode())) {
      const prior=originals.get(node);
      const source=prior && node.nodeValue===prior.output?prior.source:node.nodeValue;
      const output=translate(source);if(node.nodeValue!==output)node.nodeValue=output;
      originals.set(node,{source,output});
    }
    document.querySelectorAll('[aria-label],[placeholder],[title]').forEach(el=>{
      if(el.closest('[data-no-i18n]'))return;
      const previous=attributes.get(el)||{};
      for(const attr of ['aria-label','placeholder','title']){
        if(!el.hasAttribute(attr))continue;
        const raw=el.getAttribute(attr),old=previous[attr],source=old&&raw===old.output?old.source:raw,output=translate(source);
        if(raw!==output)el.setAttribute(attr,output);previous[attr]={source,output};
      }
      attributes.set(el,previous);
    });
    document.querySelectorAll('[data-no-i18n],.topic-text,.reply-item p,.post .txt,.feed-mini p').forEach(el=>{if(!el.hasAttribute('lang'))el.lang='fr';});
    const langButton=document.querySelector('#languagebtn');if(langButton)langButton.querySelector('span').textContent=language()==='fr'?'FR':'KR';
    document.title=t(sectionName(route()))+' · Concordia';
    observer?.observe(document.body,{childList:true,subtree:true,characterData:true});
  }
  const renderBeforePreferences=render;
  render=function(){renderBeforePreferences();removeLegacyThemeControls();translateUI();};
  window.removeEventListener('hashchange',renderBeforePreferences);window.addEventListener('hashchange',render);
  const modalBeforePreferences=modal;
  modal=function(html){modalBeforePreferences(html);translateUI();};
  let pendingTranslation=false;
  observer=new MutationObserver(()=>{if(pendingTranslation)return;pendingTranslation=true;queueMicrotask(()=>{pendingTranslation=false;translateUI();});});

  $('#themebtn').removeEventListener('click',toggleTheme);
  $('#themebtn').dataset.pref='open-theme';$('#themebtn').setAttribute('aria-label','Choisir le thème');$('#themebtn').title='Choisir le thème';
  $('#themebtn').insertAdjacentHTML('beforebegin','<button class="iconbtn languagebtn" id="languagebtn" data-pref="open-language" aria-label="Choisir la langue" title="Choisir la langue"><span data-no-i18n>FR</span></button>');
  if(portable())$('.demo-pill').textContent='Version locale';
  document.addEventListener('click',e=>{
    const button=e.target.closest('[data-pref]');if(!button)return;e.preventDefault();
    const action=button.dataset.pref,value=button.dataset.value;
    if(action==='open-language'||action==='open-theme')modal(preferenceModal(action==='open-language'?'language':'theme'));
    if(action==='local-help')modal(localHelp());
    if(action==='language'||action==='theme'){
      if(action==='language'&&!['fr','rcf'].includes(value)||action==='theme'&&!THEMES.some(x=>x.id===value))return;
      const wasModal=button.closest('#modal'),focusValue=value;
      if(action==='language')prefs().language=value;else prefs().appearance=value;
      applyTheme();const stored=save();
      // Preserve an unfinished form if preferences were ever opened from one.
      if(wasModal){$('#modal').innerHTML=preferenceModal(action);$('#modal h2').id='modal-title';translateUI();}
      else render();
      document.querySelector(`${wasModal?'#modal':'#content'} [data-pref="${action}"][data-value="${focusValue}"]`)?.focus();
      if(stored)toast(t(action==='language'?'Langue enregistrée.':'Thème enregistré.'));
    }
  });
  applyTheme();render();
})();

</script>
